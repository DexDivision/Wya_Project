<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA V2.7.0 - FAITH OS</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --glow-pink: 0 0 15px var(--neon-pink); 
            --btn-glow-pink: 0 0 25px var(--neon-pink); 
            --sidebar-bg: rgba(5, 5, 5, 0.98);
            --connected: #00ff41;
            --connected-glow: 0 0 15px #00ff41;
            --spotify-green: #1DB954;
            --steam-blue: #1b2838;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #FFF; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        
        #versionTag { position: fixed; top: 15px; right: 20px; font-size: 0.6rem; color: var(--neon-pink); font-weight: 900; z-index: 1000; letter-spacing: 2px; opacity: 0.6; }
        #personnelCount { position: fixed; top: 50px; right: 20px; font-size: 0.7rem; color: var(--connected); font-weight: 900; z-index: 1000; letter-spacing: 1px; }

        .screen { height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px; transition: 0.3s; position: absolute; top: 0; left: 0; background: transparent; z-index: 10; }
        .hidden { transform: scale(0.95); opacity: 0; pointer-events: none; }
        .active { transform: scale(1); opacity: 1; pointer-events: all; }
        
        #sidebarOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); z-index: 90; display: none; }
        #sidebarOverlay.visible { display: block; }
        .sidebar-toggle { position: fixed; left: 20px; top: 15px; z-index: 110; font-size: 1.8rem; color: var(--neon-pink); cursor: pointer; background: none; border: none; }

        /* Personnel Modal Expansion */
        #profileModal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 92%; max-width: 360px; max-height: 80vh; background: rgba(5,5,5,0.98); border: 1px solid var(--neon-pink); border-radius: 28px; padding: 30px; z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: var(--glow-pink); overflow-y: auto; scrollbar-width: none; }
        #profileModal::-webkit-scrollbar { display: none; }
        #profileModal.show { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #444; cursor: pointer; font-weight: 900; z-index: 210; }
        
        .truth-meter { width: 100%; height: 4px; background: #111; border-radius: 2px; margin: 15px 0; overflow: hidden; }
        .truth-fill { height: 100%; background: var(--connected); box-shadow: 0 0 10px var(--connected); transition: width 1.2s; }

        /* Interest Chips */
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; }
        .interest-chip { padding: 6px 12px; background: rgba(255, 0, 255, 0.1); border: 1px solid var(--neon-pink); border-radius: 12px; font-size: 0.65rem; font-weight: 800; color: var(--neon-pink); text-transform: uppercase; }

        /* Neural Audit Blocks */
        .audit-section { margin-top: 15px; padding: 12px; border-radius: 14px; text-align: left; border: 1px solid rgba(255,255,255,0.05); }
        .audit-header { font-size: 0.55rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .spotify { color: var(--spotify-green); background: rgba(29, 185, 84, 0.05); }
        .steam { color: #66c0f4; background: rgba(102, 192, 244, 0.05); }
        .audit-body { font-size: 0.8rem; color: #FFF; font-weight: 500; }

        /* Radar Core */
        .radar-container { position: relative; width: 340px; height: 340px; display: flex; justify-content: center; align-items: center; }
        .radar-circle { position: absolute; width: 100%; height: 100%; border: 1px solid rgba(255, 0, 255, 0.1); border-radius: 50%; }
        .sonar-sweep { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 0, 255, 0.05) 30deg, transparent 60deg); animation: sweep 4s linear infinite; pointer-events: none; }
        .radar-center { width: 10px; height: 10px; background: #FFF; border-radius: 50%; box-shadow: 0 0 15px #FFF; z-index: 60; }
        
        #pingBeamLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 59; }
        .ping-line { stroke: var(--neon-pink); stroke-width: 2; stroke-linecap: round; fill: none; stroke-dasharray: 500; stroke-dashoffset: 500; filter: drop-shadow(0 0 8px var(--neon-pink)); }
        @keyframes drawBeam { to { stroke-dashoffset: 0; } }

        .user-node { position: absolute; width: 18px; height: 18px; background: var(--neon-pink); border-radius: 50%; box-shadow: var(--glow-pink); cursor: pointer; z-index: 55; animation: proximityPulse infinite ease-in-out; }
        @keyframes proximityPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } }

        .btn { height: 60px; border-radius: 16px; font-size: 1rem; font-weight: 900; cursor: pointer; text-transform: uppercase; border: 2px solid var(--neon-pink); background: transparent; color: var(--neon-pink); width: 100%; box-shadow: var(--btn-glow-pink); }
        .btn-active { border-color: var(--connected); color: var(--connected); box-shadow: var(--connected-glow); }
        
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body onload="checkAuth()">
    <div id="versionTag">FAITH_OS_V2.7.0</div>
    <div id="personnelCount" style="display:none;">SIGNALS: --</div>
    <div id="sidebarOverlay" onclick="closeAllOverlays()"></div>
    
    <button id="menuBtn" class="sidebar-toggle" style="display:none;" onclick="toggleSidebar()">☰</button>

    <div id="profileModal">
        <span class="modal-close" onclick="closeProfile()">✕</span>
        <div style="text-align: center;">
            <p id="proximityHUD" style="font-size: 0.6rem; color: var(--neon-pink); margin-bottom: 5px; font-weight: 900;">SIGNAL DISTANCE: --m</p>
            <h3 id="modalName" style="margin: 0; color: #FFF; letter-spacing: 2px; font-size: 1.4rem;">USER_ID</h3>
            <p id="modalTag" style="font-size: 0.7rem; color: #888; margin: 8px 0; text-transform: uppercase;">NEURAL ARCHIVE OPEN</p>
            
            <div class="truth-meter"><div id="truthFill" class="truth-fill" style="width: 0%;"></div></div>
            <p style="font-size: 0.8rem; font-weight: 900; color: var(--connected);">TRUTH_SCORE: <span id="truthScore">0</span>%</p>
            
            <div id="interestContainer" class="chip-container"></div>

            <div class="audit-section spotify">
                <div class="audit-header">● SPOTIFY VIBE AUDIT</div>
                <div id="spotifyContent" class="audit-body">--</div>
            </div>

            <div class="audit-section steam">
                <div class="audit-header">● STEAM FINGERPRINT</div>
                <div id="steamContent" class="audit-body">--</div>
            </div>

            <button id="pingTrigger" class="btn" style="margin-top: 25px; height: 50px; font-size: 0.8rem;" onclick="executePing()">Initiate Ping</button>
        </div>
    </div>

    <div id="landingScreen" class="screen active">
        <h1 style="font-size: 4rem; color: var(--neon-pink); text-shadow: var(--glow-pink); letter-spacing: 15px; font-weight: 900;">WYA</h1>
        <button class="btn" onclick="simulateLogin()">Initialize OS</button>
    </div>

    <div id="mapScreen" class="screen hidden">
        <div class="radar-container" id="radarField">
            <svg id="pingBeamLayer"><line id="beamLine" class="ping-line" x1="170" y1="170" x2="170" y2="170" /></svg>
            <div class="radar-circle"></div><div class="sonar-sweep"></div><div class="radar-center"></div>
        </div>
        <button class="btn" onclick="logout()">Deactivate OS</button>
    </div>

    <script>
        const mockUsers = [
            { name: "Alpha_01", tag: "Logic Architect", score: 96, dist: 45, tags: ["Logic", "First Principles", "Chess"], spotify: "Midnight City - M83", steam: "High Activity - Strategy Gamer" },
            { name: "Neon_Rider", tag: "Neural Networker", score: 82, dist: 120, tags: ["Cyber", "Gamer", "Anime"], spotify: "Harder, Better, Faster - Daft Punk", steam: "Competitive - FPS Lead" },
            { name: "Faith_Lead", tag: "Strategic Founder", score: 100, dist: 10, tags: ["FAITH", "Visionary", "Legacy"], spotify: "The Power of Now - Eckhart", steam: "Low Activity - System Focus" },
            { name: "Sync_Vibe", tag: "Social Lead", score: 85, dist: 200, tags: ["Music", "Concerts", "Photography"], spotify: "Starlight - Muse", steam: "Casual - Adventure Games" }
        ];

        let activeUser = null;

        function checkAuth() { if (localStorage.getItem('FAITH_AUTH_TOKEN')) navigate('mapScreen'); }
        function simulateLogin() { localStorage.setItem('FAITH_AUTH_TOKEN', 'true'); navigate('mapScreen'); }
        function logout() { localStorage.removeItem('FAITH_AUTH_TOKEN'); location.reload(); }

        function closeAllOverlays() {
            document.getElementById('profileModal').classList.remove('show');
            document.getElementById('sidebarOverlay').classList.remove('visible');
            document.getElementById('beamLine').style.animation = 'none';
            document.getElementById('pingTrigger').innerText = "Initiate Ping";
            document.getElementById('pingTrigger').classList.remove('btn-active');
        }

        function navigate(id) {
            document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.add('hidden'); });
            document.getElementById(id).classList.add('active');
            if(id === 'mapScreen') renderNodes();
        }

        function renderNodes() {
            const field = document.getElementById('radarField');
            document.querySelectorAll('.user-node').forEach(n => n.remove());
            mockUsers.forEach((user, i) => {
                const node = document.createElement('div');
                node.className = 'user-node';
                const angle = (i * 90 + 45) * Math.PI / 180;
                const radius = 60 + (user.dist * 0.5);
                user.x = 170 + radius * Math.cos(angle);
                user.y = 170 + radius * Math.sin(angle);
                node.style.left = (user.x - 9) + 'px';
                node.style.top = (user.y - 9) + 'px';
                node.style.animationDuration = `${Math.max(0.4, user.dist / 50)}s`;
                node.onclick = () => showProfile(user);
                field.appendChild(node);
            });
        }

        function showProfile(user) {
            activeUser = user;
            document.getElementById('modalName').innerText = user.name;
            document.getElementById('modalTag').innerText = user.tag;
            document.getElementById('truthScore').innerText = user.score;
            document.getElementById('proximityHUD').innerText = `SIGNAL DISTANCE: ${user.dist}m`;
            document.getElementById('spotifyContent').innerText = user.spotify;
            document.getElementById('steamContent').innerText = user.steam;
            
            // Render tags
            const container = document.getElementById('interestContainer');
            container.innerHTML = '';
            user.tags.forEach(tag => {
                const chip = document.createElement('span');
                chip.className = 'interest-chip';
                chip.innerText = tag;
                container.appendChild(chip);
            });

            document.getElementById('profileModal').classList.add('show');
            document.getElementById('sidebarOverlay').classList.add('visible');
            setTimeout(() => { document.getElementById('truthFill').style.width = user.score + '%'; }, 50);
        }

        function executePing() {
            if(!activeUser) return;
            const beam = document.getElementById('beamLine');
            const btn = document.getElementById('pingTrigger');
            beam.setAttribute('x2', activeUser.x);
            beam.setAttribute('y2', activeUser.y);
            beam.style.animation = 'drawBeam 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards';
            btn.innerText = "LOCK ACTIVE";
            btn.classList.add('btn-active');
        }

        function closeProfile() {
            closeAllOverlays();
        }
    </script>
</body>
</html>
