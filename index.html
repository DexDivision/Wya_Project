<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --accent: #888; 
            --glow: 0 0 15px var(--neon-pink);
            --btn-glow: 0 0 20px var(--neon-pink);
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: #FFF; 
            font-family: -apple-system, sans-serif; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }
        
        .screen { 
            height: 100%; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 60px 20px; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            position: absolute; 
            top: 0;
            left: 0;
        }
        
        .hidden { transform: translateX(100%); opacity: 0; }
        .active { transform: translateX(0); opacity: 1; }

        /* HEADER & SLOGAN */
        .header { text-align: center; margin-top: 40px; }
        .logo { 
            font-size: 4rem; 
            font-weight: 900; 
            letter-spacing: 8px; 
            margin: 0; 
            color: var(--neon-pink); 
            text-shadow: var(--glow);
        }
        .tagline { 
            color: #FFF; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            margin-top: 10px; 
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* GLOWING BUTTON ARCHITECTURE */
        .btn-group { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 20px; }
        
        .btn { 
            height: 60px; 
            border-radius: 15px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-primary { 
            background: transparent; 
            color: var(--neon-pink); 
            border: 3px solid var(--neon-pink); 
            box-shadow: var(--btn-glow);
            text-shadow: var(--glow);
        }

        .btn-secondary { 
            background: transparent; 
            color: #FFF; 
            border: 2px solid #FFF; 
        }

        /* SOCIAL GRID */
        .social-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            width: 100%; 
            margin-top: 15px; 
        }
        
        .btn-social { 
            height: 50px; 
            background: rgba(255, 255, 255, 0.05); 
            color: #FFF; 
            border: 1px solid #333; 
            font-size: 0.85rem; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .footer-link { color: var(--accent); font-size: 0.9rem; text-decoration: none; margin-bottom: 20px; }
        .footer-link span { color: var(--neon-pink); font-weight: bold; text-shadow: var(--glow); }
    </style>
</head>
<body>

    <div id="landingScreen" class="screen active">
        <div class="header">
            <h1 class="logo">WYA</h1>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="showAuth()">Get Started</button>
        </div>
        <div></div>
    </div>

    <div id="authScreen" class="screen hidden">
        <div class="header">
            <h1 class="logo" style="font-size: 3rem;">WYA</h1>
            <p class="tagline">Join the Network</p>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary">Create Account</button>
            <button class="btn btn-secondary">Sign In</button>
            
            <div class="social-grid">
                <button class="btn btn-social">Apple</button>
                <button class="btn btn-social">Google</button>
                <button class="btn btn-social">Instagram</button>
                <button class="btn btn-social">Snapchat</button>
                <button class="btn btn-social">Facebook</button>
                <button class="btn btn-social">X (Twitter)</button>
            </div>
        </div>

        <a href="#" class="footer-link">Already have an account? <span>Log In</span></a>
    </div>

    <script>
        function showAuth() {
            document.getElementById('landingScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('authScreen').classList.add('active');
        }
    </script>
</body>
</html>
