<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA - Boardman Alpha</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    
    <style>
        :root { 
            --neon-cyan: #00ffff; --neon-pink: #ff00ff; 
            --glass: rgba(0, 0, 0, 0.8); --bg: #000;
        }

        /* Prevent standard scrolling completely */
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed; background: var(--bg); 
            font-family: 'Inter', sans-serif; 
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(25px);
            z-index: 10000; display: flex; justify-content: center; align-items: center;
        }

        .glass-card {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 35px; padding: 30px; text-align: center; width: 85%; max-width: 400px;
        }

        .neon-text { text-transform: uppercase; letter-spacing: 3px; font-weight: 900; text-shadow: 0 0 15px var(--neon-cyan); }
        
        .auth-input {
            width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 15px;
            background: #111; border: 1px solid #333; color: #fff; font-size: 1rem;
        }

        .primary-btn {
            background: var(--neon-cyan); color: #000; border: none; padding: 20px;
            width: 100%; border-radius: 50px; font-weight: 900; text-transform: uppercase; 
            box-shadow: 0 0 20px var(--neon-cyan); cursor: pointer;
        }

        /* Category Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 25px; text-align: center;
        }

        /* Radar Node */
        .user-dot {
            width: 24px; height: 24px; background: #fff; border: 4px solid var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 20px var(--neon-cyan); position: relative;
        }
        .user-dot::after {
            content: ''; position: absolute; top: -12px; left: -12px; right: -12px; bottom: -12px;
            border: 2px solid var(--neon-cyan); border-radius: 50%;
            animation: radar-pulse 2s infinite; opacity: 0;
        }
        @keyframes radar-pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3.0); opacity: 0; }
        }

        .target-dot { width: 18px; height: 18px; background: var(--neon-pink); border: 3px solid #fff; border-radius: 50%; }

        /* THE FIX: Profile Card Slide-up */
        #profile-card {
            position: fixed; bottom: -500px; left: 0; right: 0;
            background: var(--glass); backdrop-filter: blur(30px);
            border-top: 2px solid var(--neon-cyan); border-radius: 30px 30px 0 0;
            padding: 30px; z-index: 20000; text-align: center;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #profile-card.active { bottom: 0; }
    </style>
</head>
<body>

    <div id="tos-step" class="overlay"><div class="glass-card"><h1 class="neon-text">WYA</h1><p>0.8s Intent Tracking.</p><button class="primary-btn" onclick="nextStep('tos-step', 'auth-step')">CONSENT</button></div></div>

    <div id="auth-step" class="overlay" style="display:none;"><div class="glass-card"><h2 class="neon-text">ACCESS</h2><input type="email" id="email" placeholder="Email" class="auth-input"><input type="password" id="password" placeholder="Password" class="auth-input"><button class="primary-btn" onclick="handleSignup()">ENTER</button></div></div>

    <div id="vibe-step" class="overlay" style="display:none;"><div class="glass-card"><h2 class="neon-text">VIBE</h2><div class="grid"><div class="card" onclick="setVibe('Business/Faith')">💼<h3>BUSINESS</h3></div><div class="card" onclick="setVibe('The Move')">🔥<h3>THE MOVE</h3></div></div></div></div>

    <div id="bio-step" class="overlay" style="display:none;"><div class="glass-card"><h2 class="neon-text">BIO</h2><textarea id="bio" placeholder="What's the move?" class="auth-input" style="height:100px;"></textarea><button class="primary-btn" onclick="finalizeProfile()">LAUNCH</button></div></div>

    <div id="profile-card">
        <div style="color: var(--neon-pink); font-weight: 900; font-size: 0.8rem; margin-bottom: 10px;">NODE DATA</div>
        <h2 id="card-name">Alpha Founder</h2>
        <p id="card-bio" style="color: #ccc;"></p>
        <button class="primary-btn" style="background:#fff; margin-top:20px;" onclick="document.getElementById('profile-card').classList.remove('active')">CLOSE</button>
    </div>

    <div id="map"></div>

    <script>
        const supabaseUrl = 'https://snecdlasdeolhjefdlum.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZWNkbGFzZGVvbGhqZWZkbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDU4MjQsImV4cCI6MjA5NDAyMTgyNH0.X0wQlmb5vFxXDuW4HHCQMY3tLhRfhjQ7ElifFSxAGEI'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let selectedVibe = '';

        function nextStep(current, next) {
            document.getElementById(current).style.display = 'none';
            document.getElementById(next).style.display = 'flex';
        }

        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await _supabase.auth.signUp({ email, password });
            await _supabase.auth.signInWithPassword({ email, password });
            nextStep('auth-step', 'vibe-step');
        }

        function setVibe(vibe) { selectedVibe = vibe; nextStep('vibe-step', 'bio-step'); }

        async function finalizeProfile() {
            const bioText = document.getElementById('bio').value;
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) { await _supabase.from('profiles').upsert({ id: user.id, email: user.email, current_vibe: selectedVibe, bio: bioText }); }
            document.getElementById('bio-step').style.display = 'none';
            initRadar(bioText);
        }

        function initRadar(bio) {
            mapboxgl.accessToken = 'pk.eyJ1Ijoid3lhLWxpdmUiLCJhIjoiY21wMGZ3MGdxMTdoMDRqb3BwbGVscTRmYiJ9.kuZWQ6cwqaoj5Ziw8lm1Kw';
            navigator.geolocation.getCurrentPosition((pos) => {
                const userLoc = [pos.coords.longitude, pos.coords.latitude];
                const map = new mapboxgl.Map({
                    container: 'map', style: 'mapbox://styles/mapbox/dark-v11',
                    center: userLoc, zoom: 17, pitch: 60
                });

                const el = document.createElement('div');
                el.className = 'user-dot';
                el.onclick = () => {
                    document.getElementById('card-name').innerText = "Alpha Founder";
                    document.getElementById('card-bio').innerText = bio;
                    document.getElementById('profile-card').classList.add('active');
                };
                new mapboxgl.Marker(el).setLngLat(userLoc).addTo(map);

                // Demo Node
                addNode(map, userLoc[0] + 0.0005, userLoc[1] + 0.0004, "Test User", "Demoing WYA.");

            }, () => { alert("Enable GPS!"); }, { enableHighAccuracy: true });
        }

        function addNode(map, lng, lat, title, b) {
            const el = document.createElement('div'); el.className = 'target-dot';
            el.onclick = () => {
                document.getElementById('card-name').innerText = title;
                document.getElementById('card-bio').innerText = b;
                document.getElementById('profile-card').classList.add('active');
            };
            new mapboxgl.Marker(el).setLngLat([lng, lat]).addTo(map);
        }
    </script>
</body>
</html>
