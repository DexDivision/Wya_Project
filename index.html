<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQF0GRW2WG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date()); gtag('config', 'G-DQF0GRW2WG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WYA V3.10.0</title>
    
    <style>
        :root { 
            --pink: #ff00ff; --green: #00ff41; --blue: #00f2ff;
            --glass: rgba(20, 20, 25, 0.8); --blur: blur(25px); 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: #08080a; color: #fff; 
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
        }

        /* THE MAP LAYER */
        #mapCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }
        .street { position: absolute; background: rgba(0, 242, 255, 0.05); }
        .building { position: absolute; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; }
        .poi { position: absolute; font-size: 0.8rem; opacity: 0.4; filter: grayscale(1); }

        /* SCREENS */
        .screen { 
            display: none; height: 100vh; width: 100vw; 
            flex-direction: column; align-items: center; justify-content: center; 
            padding: 30px; position: absolute; z-index: 10;
        }
        .active { display: flex; }

        .top-nav { position: fixed; top: 50px; width: 90%; display: flex; justify-content: space-between; z-index: 100; }
        .nav-icon { background: var(--glass); backdrop-filter: var(--blur); padding: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* RADAR SYSTEM */
        .radar-center { position: relative; width: 350px; height: 350px; display: flex; align-items: center; justify-content: center; }
        .radar-ring { position: absolute; border: 1px solid rgba(255, 0, 255, 0.15); border-radius: 50%; animation: pulseRing 4s infinite linear; }
        @keyframes pulseRing { 0% { transform: scale(0.5); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }

        .user-node { position: absolute; width: 12px; height: 12px; background: var(--pink); border-radius: 50%; box-shadow: 0 0 15px var(--pink); cursor: pointer; z-index: 20; }
        .user-node.intent-match { background: var(--blue); box-shadow: 0 0 15px var(--blue); }
        .me-node { width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff; z-index: 30; border: 3px solid #000; }

        /* DISCOVERY DRAWER (Swipe Up Style) */
        .drawer {
            position: fixed; bottom: -85%; left: 0; width: 100%; height: 90%;
            background: var(--glass); backdrop-filter: var(--blur);
            border-top: 1px solid rgba(255,0,255,0.3); border-radius: 30px 30px 0 0;
            z-index: 200; transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 20px;
        }
        .drawer.open { bottom: 0; }
        .drawer-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 0 auto 20px; }

        .btn { background: var(--pink); color: #000; border: none; padding: 20px; border-radius: 20px; font-weight: 900; width: 100%; max-width: 300px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        
        .focus-card { position: fixed; bottom: 120px; width: 90%; background: var(--glass); backdrop-filter: var(--blur); border-radius: 25px; padding: 20px; border: 1px solid var(--pink); display: none; z-index: 150; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body onload="init()">

    <div id="mapCanvas"></div>

    <div id="screen_radar" class="screen active">
        <div class="top-nav">
            <div class="nav-icon" onclick="toggleDrawer()">📜</div>
            <div style="text-align: center;">
                <div style="font-size: 0.6rem; letter-spacing: 3px; color: var(--pink); font-weight: 900;">WYA LIVE</div>
                <div id="activeCity" style="font-size: 0.8rem; font-weight: 300; opacity: 0.6;">BOARDMAN, OH</div>
            </div>
            <div class="nav-icon" onclick="hardReset()">✕</div>
        </div>

        <div class="radar-center">
            <div class="radar-ring" style="width: 100%; height: 100%;"></div>
            <div class="radar-ring" style="width: 70%; height: 70%; animation-delay: 1s;"></div>
            <div class="radar-ring" style="width: 40%; height: 40%; animation-delay: 2s;"></div>
            <div class="me-node"></div>
            <div id="nodeField"></div>
        </div>

        <div style="position: absolute; bottom: 50px; text-align: center; width: 100%;">
            <p class="label" style="color: #444;">Swipe up for Discovery List</p>
            <div class="nav-icon" style="margin: 10px auto;" onclick="toggleDrawer()">↑</div>
        </div>
    </div>

    <div id="focusCard" class="focus-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <h2 id="fName" style="margin:0; font-size: 1.5rem;">User Name</h2>
                <p id="fIntent" style="color: var(--pink); font-size: 0.7rem; margin: 5px 0; letter-spacing: 1px;">SOCIAL</p>
            </div>
            <span onclick="closeFocus()" style="font-size: 1.2rem; opacity: 0.5;">✕</span>
        </div>
        <div id="fTags" style="margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap;"></div>
    </div>

    <div id="listDrawer" class="drawer">
        <div class="drawer-handle" onclick="toggleDrawer()"></div>
        <h2 class="label" style="margin-bottom: 20px;">Geofence Intelligence</h2>
        <div id="userList" style="height: 80%; overflow-y: auto;"></div>
    </div>

    <script>
        const users = [
            { name: "Nova_01", intent: "SOCIAL", tags: ["Nightlife", "Gym"], x: 60, y: -80 },
            { name: "Architect_X", intent: "NETWORKING", tags: ["SaaS", "Design"], x: -100, y: 40 },
            { name: "Jade_Sky", intent: "RELATIONSHIP", tags: ["Travel", "Dining"], x: 40, y: 110 },
            { name: "Viper", intent: "VIBE", tags: ["Crypto", "Gaming"], x: -70, y: -120 }
        ];

        function init() {
            generateMap();
            renderNodes();
            renderList();
        }

        function generateMap() {
            const map = document.getElementById('mapCanvas');
            // Streets
            for(let i=0; i<5; i++) {
                const s = document.createElement('div');
                s.className = 'street';
                s.style.width = '100%'; s.style.height = '2px';
                s.style.top = (Math.random() * 100) + '%';
                map.appendChild(s);
            }
            // POI
            const icons = ['☕', '🍸', '🌳', '🍕', '🏀'];
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.className = 'poi';
                p.innerText = icons[Math.floor(Math.random()*icons.length)];
                p.style.top = (Math.random() * 90) + '%';
                p.style.left = (Math.random() * 90) + '%';
                map.appendChild(p);
            }
        }

        function renderNodes() {
            const field = document.getElementById('nodeField');
            users.forEach(u => {
                const n = document.createElement('div');
                n.className = 'user-node';
                n.style.left = (175 + u.x) + 'px';
                n.style.top = (175 + u.y) + 'px';
                n.onclick = (e) => { e.stopPropagation(); showFocus(u); };
                field.appendChild(n);
            });
        }

        function showFocus(u) {
            const card = document.getElementById('focusCard');
            document.getElementById('fName').innerText = u.name;
            document.getElementById('fIntent').innerText = u.intent;
            document.getElementById('fTags').innerHTML = u.tags.map(t => `<span style="background:rgba(255,0,255,0.1); padding:5px 10px; border-radius:8px; font-size:0.6rem; color:var(--pink); border:1px solid rgba(255,0,255,0.2);">${t}</span>`).join('');
            card.style.display = 'block';
        }

        function renderList() {
            const list = document.getElementById('userList');
            users.forEach(u => {
                const item = document.createElement('div');
                item.style.padding = '20px'; item.style.borderBottom = '1px solid #222';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <span style="font-weight:900;">${u.name}</span>
                        <span style="color:var(--pink); font-size:0.7rem;">0.${Math.floor(Math.random()*9)}mi</span>
                    </div>
                    <div style="font-size:0.6rem; opacity:0.5; margin-top:5px;">${u.tags.join(' • ')}</div>
                `;
                list.appendChild(item);
            });
        }

        function toggleDrawer() { document.getElementById('listDrawer').classList.toggle('open'); closeFocus(); }
        function closeFocus() { document.getElementById('focusCard').style.display = 'none'; }
        function hardReset() { if(confirm("Terminate Session?")) { localStorage.clear(); location.reload(); } }

        function init() {
            generateMap();
            renderNodes();
            renderList();
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    // In a real app, reverse geocoding would go here.
                });
            }
        }
    </script>
</body>
</html>
