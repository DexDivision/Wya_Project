<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WYA - Find The Move</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --neon-cyan: #00ffff; --neon-pink: #ff00ff; 
            --glass: rgba(0, 0, 0, 0.85); --bg: #000;
        }

        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed; background: var(--bg); 
            font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* Search Bar UI */
        #search-container {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 450px; z-index: 5000; display: none;
        }
        .search-bar {
            width: 100%; padding: 18px 25px; border-radius: 35px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(25px);
            border: 1px solid var(--neon-cyan); color: #fff;
            box-shadow: 0 0 25px rgba(0,255,255,0.15); font-size: 1rem;
            outline: none; box-sizing: border-box;
        }

        /* UI Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: 10000; display: flex; justify-content: center; align-items: center;
        }

        .glass-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 45px; padding: 40px 30px; text-align: center; width: 88%; max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Branding */
        .brand-logo { font-size: 5rem; font-weight: 900; letter-spacing: -2px; color: #fff; line-height: 1; margin: 0; }
        .brand-slogan { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; color: var(--neon-pink); margin-top: 10px; margin-bottom: 30px; }
        
        .primary-btn {
            background: var(--neon-cyan); color: #000; border: none; padding: 20px;
            width: 100%; border-radius: 50px; font-weight: 900; text-transform: uppercase; 
            box-shadow: 0 0 30px var(--neon-cyan); cursor: pointer; transition: 0.3s;
        }

        /* Tags & Identity */
        .tag-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 25px; }
        .id-tag {
            padding: 12px 20px; border-radius: 25px; background: rgba(255,255,255,0.05);
            font-size: 0.8rem; font-weight: 800; border: 1px solid #333; cursor: pointer; transition: 0.2s;
        }
        .id-tag.active { background: var(--neon-pink); border-color: #fff; box-shadow: 0 0 15px var(--neon-pink); }

        /* Voice Intent UI */
        .mic-btn {
            width: 100px; height: 100px; border-radius: 50%; background: var(--neon-cyan);
            border: none; color: #000; font-size: 2.5rem; cursor: pointer;
            box-shadow: 0 0 40px var(--neon-cyan); transition: 0.3s; margin: 20px 0;
            display: flex; justify-content: center; align-items: center;
        }
        .mic-btn.listening {
            background: var(--neon-pink); box-shadow: 0 0 60px var(--neon-pink);
            animation: mic-pulse 1.5s infinite;
        }
        @keyframes mic-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .transcript-preview {
            color: #fff; font-size: 1.1rem; font-weight: 700; font-style: italic;
            min-height: 1.5rem; margin-bottom: 20px;
        }

        /* Categories */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
        .card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            padding: 15px; border-radius: 25px; cursor: pointer; text-align: center;
        }
        .card.selected { background: var(--neon-cyan); color: #000; font-weight: 900; }
        .card span { display: block; font-size: 1.4rem; margin-bottom: 5px; }

        /* WYA Engine Animation */
        .engine-text { font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--neon-cyan); margin-top: 25px; letter-spacing: 1px; }

        /* Profile Card */
        #profile-card {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(40px);
            border-top: 2px solid var(--neon-cyan); border-radius: 40px 40px 0 0;
            padding: 40px; z-index: 20000; text-align: center;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #profile-card.active { bottom: 0; }
        .my-tag-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 15px 0; }
        .tiny-tag { font-size: 0.65rem; padding: 5px 12px; border-radius: 12px; background: var(--neon-pink); font-weight: 900; }

        /* Radar Styling */
        .user-dot {
            width: 28px; height: 28px; background: #fff; border: 4px solid var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 30px var(--neon-cyan); position: relative;
        }
        .user-dot::after {
            content: ''; position: absolute; top: -14px; left: -14px; right: -14px; bottom: -14px;
            border: 2px solid var(--neon-cyan); border-radius: 50%;
            animation: radar-pulse 2s infinite; opacity: 0;
        }
        @keyframes radar-pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3.5); opacity: 0; } }

        .poi-icon { font-size: 1.5rem; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); cursor: pointer; }
    </style>
</head>
<body>

    <div id="search-container"><input type="text" class="search-bar" placeholder="SEARCH INTENT (e.g. Club, Business, Food)"></div>

    <div id="tos-step" class="overlay">
        <div class="glass-card">
            <h1 class="brand-logo">WYA</h1>
            <p class="brand-slogan">FIND THE MOVE. BE THE MOVE.</p>
            <button class="primary-btn" onclick="nextStep('tos-step', 'tag-step')">GET STARTED</button>
        </div>
    </div>

    <div id="tag-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 style="font-weight: 900; letter-spacing: 2px; font-size: 1.2rem; margin-bottom: 5px;">WHO ARE YOU?</h2>
            <div class="tag-container">
                <div class="id-tag" onclick="toggleTag(this)">GAMING</div>
                <div class="id-tag" onclick="toggleTag(this)">ANIME</div>
                <div class="id-tag" onclick="toggleTag(this)">CREATIVE</div>
                <div class="id-tag" onclick="toggleTag(this)">FITNESS</div>
                <div class="id-tag" onclick="toggleTag(this)">BUSINESS</div>
                <div class="id-tag" onclick="toggleTag(this)">NIGHTLIFE</div>
            </div>
            <button class="primary-btn" style="margin-top: 30px;" onclick="nextStep('tag-step', 'vibe-step')">SET IDENTITY</button>
        </div>
    </div>

    <div id="vibe-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 style="font-weight: 900; letter-spacing: 2px; font-size: 1.2rem; margin-bottom: 20px;">SELECT CATEGORY</h2>
            <div class="grid">
                <div class="card" onclick="selectVibe(this, 'Business')"><span>💼</span><h3>BUSINESS</h3></div>
                <div class="card" onclick="selectVibe(this, 'Clubbing')"><span>✨</span><h3>CLUBBING</h3></div>
                <div class="card" onclick="selectVibe(this, 'Romantic')"><span>🌹</span><h3>ROMANCE</h3></div>
                <div class="card" onclick="selectVibe(this, 'The Move')"><span>🔥</span><h3>THE MOVE</h3></div>
            </div>
            <button class="primary-btn" style="margin-top: 25px;" onclick="nextStep('vibe-step', 'bio-step')">NEXT</button>
        </div>
    </div>

    <div id="bio-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 class="neon-title" style="font-size: 1.1rem; color: #fff; text-shadow: none;">FAITH AI INTENT</h2>
            <p style="color: #666; font-size: 0.7rem;">TAP TO SPEAK YOUR INTENT</p>
            
            <div id="transcript" class="transcript-preview">...waiting for voice input...</div>
            
            <center>
                <button id="mic-trigger" class="mic-btn" onclick="startVoiceInput()">
                    <i class="fas fa-microphone"></i>
                </button>
            </center>

            <button class="primary-btn" style="margin-top: 20px;" onclick="runEngine()">CALIBRATE RADAR</button>
        </div>
    </div>

    <div id="engine-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h1 class="brand-logo" style="font-size: 3rem; color: var(--neon-cyan);">WYA</h1>
            <div style="width: 100%; height: 2px; background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); margin-top: 20px;"></div>
            <p id="engine-status" class="engine-text">CALIBRATING SPATIAL DATA...</p>
        </div>
    </div>

    <div id="profile-card">
        <h2 id="card-name" style="color: var(--neon-cyan); margin: 0; font-weight: 900;">Alpha Founder</h2>
        <div id="card-tags" class="my-tag-display"></div>
        <p id="card-bio" style="color: #ccc; margin-bottom: 30px; line-height: 1.4;"></p>
        <button class="primary-btn" style="background:#fff; color:#000;" onclick="document.getElementById('profile-card').classList.remove('active')">CLOSE</button>
    </div>

    <div id="map"></div>

    <script>
        const supabaseUrl = 'https://snecdlasdeolhjefdlum.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZWNkbGFzZGVvbGhqZWZkbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDU4MjQsImV4cCI6MjA5NDAyMTgyNH0.X0wQlmb5vFxXDuW4HHCQMY3tLhRfhjQ7ElifFSxAGEI'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let selectedVibe = '';
        let myTags = [];
        let finalBio = '';

        // Speech Recognition Setup
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let speech;
        if (Recognition) {
            speech = new Recognition();
            speech.continuous = false;
            speech.lang = 'en-US';
            speech.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('transcript').innerText = `"${transcript}"`;
                finalBio = transcript;
                document.getElementById('mic-trigger').classList.remove('listening');
            };
            speech.onerror = () => {
                document.getElementById('mic-trigger').classList.remove('listening');
                alert("Voice check failed. Please check permissions.");
            };
        }

        function startVoiceInput() {
            if (!speech) { alert("Speech not supported on this browser."); return; }
            document.getElementById('mic-trigger').classList.add('listening');
            document.getElementById('transcript').innerText = "Listening...";
            speech.start();
        }

        function nextStep(current, next) {
            document.getElementById(current).style.display = 'none';
            document.getElementById(next).style.display = 'flex';
        }

        function toggleTag(el) {
            el.classList.toggle('active');
            const tag = el.innerText;
            if (myTags.includes(tag)) myTags = myTags.filter(t => t !== tag);
            else myTags.push(tag);
        }

        function selectVibe(el, v) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected'); selectedVibe = v;
        }

        function runEngine() {
            nextStep('bio-step', 'engine-step');
            const status = document.getElementById('engine-status');
            const log = ["FAITH AI ANALYZING VOICE...", "MAPPING INTENT NODES...", "ESTABLISHING GEOFENCE...", "LOCKED."];
            let i = 0;
            const interval = setInterval(() => {
                status.innerText = log[i]; i++;
                if (i === log.length) { 
                    clearInterval(interval); 
                    setTimeout(() => finalizeProfile(), 800); 
                }
            }, 700);
        }

        async function finalizeProfile() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) { 
                await _supabase.from('profiles').upsert({ id: user.id, email: user.email, current_vibe: selectedVibe, bio: finalBio, tags: myTags }); 
            }
            document.getElementById('engine-step').style.display = 'none';
            document.getElementById('search-container').style.display = 'block';
            initRadar(finalBio);
        }

        function initRadar(bio) {
            mapboxgl.accessToken = 'pk.eyJ1Ijoid3lhLWxpdmUiLCJhIjoiY21wMGZ3MGdxMTdoMDRqb3BwbGVscTRmYiJ9.kuZWQ6cwqaoj5Ziw8lm1Kw';
            navigator.geolocation.getCurrentPosition((pos) => {
                const userLoc = [pos.coords.longitude, pos.coords.latitude];
                const map = new mapboxgl.Map({
                    container: 'map', style: 'mapbox://styles/mapbox/dark-v11',
                    center: userLoc, zoom: 17, pitch: 60
                });

                const el = document.createElement('div'); el.className = 'user-dot';
                el.onclick = () => {
                    document.getElementById('card-bio').innerText = bio || "Active WYA Node";
                    document.getElementById('card-tags').innerHTML = myTags.map(t => `<div class="tiny-tag">${t}</div>`).join('');
                    document.getElementById('profile-card').classList.add('active');
                };
                new mapboxgl.Marker(el).setLngLat(userLoc).addTo(map);

            }, () => { alert("GPS REQ"); }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
