<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --glow-pink: 0 0 15px var(--neon-pink);
            --btn-glow-pink: 0 0 25px var(--neon-pink);
            --apple: #ffffff; --google: #4285F4; --insta: #E1306C; 
            --snap: #FFFC00; --fb: #1877F2; --x: #ffffff; --gmail: #EA4335;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            margin: 0; background: var(--bg); color: #FFF; 
            font-family: -apple-system, sans-serif; overflow: hidden; 
            height: 100vh; width: 100vw;
        }
        
        .screen { 
            height: 100%; width: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-between; padding: 60px 20px; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            position: absolute; top: 0; left: 0; background: transparent; z-index: 10;
        }
        
        .hidden { transform: translateX(100%); opacity: 0; pointer-events: none; z-index: 0; visibility: hidden; }
        .active { transform: translateX(0); opacity: 1; pointer-events: all; z-index: 10; visibility: visible; }

        /* HEADER SECTION */
        .header { text-align: center; margin-top: 20px; text-shadow: 0 0 20px #000; }
        .logo { font-size: 4rem; font-weight: 900; letter-spacing: 10px; margin: 0; color: var(--neon-pink); text-shadow: var(--glow-pink); }
        .tagline { color: var(--neon-pink); font-size: 0.9rem; text-transform: uppercase; margin-top: 5px; letter-spacing: 4px; font-weight: 800; text-shadow: var(--glow-pink); }

        /* SIMULATED MAP LAYER */
        .map-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0; z-index: 1;
            transform: perspective(600px) rotateX(60deg) translateY(-50px) scale(2);
            transition: opacity 1s ease;
        }
        .map-layer.visible { opacity: 1; }

        /* RADAR UI */
        .radar-container { position: relative; width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; margin: 20px 0; z-index: 20; }
        .radar-circle { position: absolute; width: 100%; height: 100%; border: 1px solid rgba(255, 0, 255, 0.3); border-radius: 50%; box-shadow: inset 0 0 30px rgba(255, 0, 255, 0.1); background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%); }
        .radar-pulse { position: absolute; width: 100%; height: 100%; border: 2px solid var(--neon-pink); border-radius: 50%; animation: pulse 3s infinite; opacity: 0; }
        .radar-center { width: 12px; height: 12px; background: var(--neon-pink); border-radius: 50%; box-shadow: var(--btn-glow-pink); z-index: 10; }
        
        .user-node {
            position: absolute; width: 12px; height: 12px; background: #FFF; 
            border-radius: 50%; box-shadow: 0 0 15px #FFF, 0 0 30px var(--neon-pink); opacity: 0;
            animation: fadeInOut 4s infinite; cursor: pointer; z-index: 30;
        }

        /* NODE POPUP */
        .node-popup {
            position: absolute; top: 45%; background: rgba(17, 17, 17, 0.95); border: 2px solid var(--neon-pink);
            border-radius: 12px; padding: 15px; color: #FFF; text-align: center; box-shadow: var(--glow-pink);
            z-index: 50; transform: scale(0); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; width: 200px;
        }
        .node-popup.show { transform: scale(1); pointer-events: all; }
        .popup-name { font-weight: 900; font-size: 1.2rem; color: var(--neon-pink); text-transform: uppercase; margin-bottom: 5px;}
        .popup-tag { font-size: 0.8rem; background: #222; padding: 4px 8px; border-radius: 8px; display: inline-block; border: 1px solid #444; }

        @keyframes pulse { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
        @keyframes fadeInOut { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.2); } }

        /* FORMS & BUTTONS */
        .form-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .input-field { width: 100%; height: 55px; background: rgba(17,17,17,0.8); border: 2px solid #333; border-radius: 12px; padding: 0 15px; color: #FFF; font-size: 1.1rem; }
        .input-field:focus { border-color: var(--neon-pink); box-shadow: var(--glow-pink); }
        textarea.input-field { height: 100px; padding: 15px; resize: none; }

        .btn-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 20;}
        .btn { height: 55px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; transition: 0.2s; border: none; }
        .btn-pink { background: rgba(0,0,0,0.5); color: var(--neon-pink); border: 4px solid var(--neon-pink) !important; box-shadow: var(--btn-glow-pink); text-shadow: var(--glow-pink); width: 100%; backdrop-filter: blur(4px);}
        .btn-social { background: #111; color: #FFF; border-width: 2px; border-style: solid; font-size: 0.75rem; border-radius: 10px; height: 50px; }

        .apple { border-color: var(--apple); } .google { border-color: var(--google); } .insta { border-color: var(--insta); }
        .snap { border-color: var(--snap); color: var(--snap); } .facebook { border-color: var(--fb); } .x-com { border-color: var(--x); } .gmail { border-color: var(--gmail); }

        .tag-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .tag { padding: 10px 18px; border: 1.5px solid #444; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: #888; cursor: pointer; background: rgba(0,0,0,0.6);}
        .tag.selected { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: var(--glow-pink); }

        .footer-link { color: #888; font-size: 0.9rem; text-decoration: none; margin-bottom: 20px; cursor: pointer; text-align: center; z-index: 20; }
        .footer-link span { color: var(--neon-pink); font-weight: bold; text-shadow: var(--glow-pink); }
    </style>
</head>
<body>

    <div id="globalMapLayer" class="map-layer"></div>

    <div id="landingScreen" class="screen active">
        <div class="header"><h1 class="logo">WYA</h1><p class="tagline">Where You At?</p></div>
        <div class="btn-group"><button class="btn btn-pink" onclick="navigate('authScreen')">Get Started</button></div>
        <div></div>
    </div>

    <div id="authScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3.5rem;">WYA</h1><p class="tagline">Where You At?</p></div>
        <div class="btn-group">
            <button class="btn btn-pink" onclick="navigate('signUpScreen')">Create Account</button>
            <button class="btn btn-pink" onclick="navigate('signInScreen')">Sign In</button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;">
                <button class="btn btn-social apple">Apple</button> <button class="btn btn-social google">Google</button>
                <button class="btn btn-social insta">Instagram</button> <button class="btn btn-social snap">Snapchat</button>
                <button class="btn btn-social facebook">Facebook</button> <button class="btn btn-social x-com">X</button>
                <button class="btn btn-social gmail">Gmail</button> <button class="btn btn-social" style="border-color:#333">More...</button>
            </div>
        </div>
        <div class="footer-link" onclick="navigate('signInScreen')">Already have an account? <span>Sign In</span></div>
    </div>

    <div id="signUpScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3rem;">JOIN</h1></div>
        <form class="form-container" onsubmit="event.preventDefault(); navigate('onboardingScreen')">
            <input type="text" class="input-field" placeholder="Username" required>
            <input type="email" class="input-field" placeholder="Email" required>
            <input type="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="btn btn-pink">Register</button>
        </form>
        <div class="footer-link" onclick="navigate('authScreen')"><span>Back</span></div>
    </div>

    <div id="signInScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3rem;">LOGIN</h1></div>
        <form class="form-container" onsubmit="event.preventDefault(); navigate('onboardingScreen')">
            <input type="text" class="input-field" placeholder="Username or Email" required>
            <input type="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="btn btn-pink">Login</button>
        </form>
        <div class="footer-link" onclick="navigate('authScreen')"><span>Back</span></div>
    </div>

    <div id="onboardingScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 2.5rem;">SETUP</h1><p class="tagline">AI Personalization</p></div>
        <div id="step1" class="form-container">
            <input type="text" class="input-field" placeholder="Display Name">
            <textarea class="input-field" placeholder="Short Bio..."></textarea>
            <button class="btn btn-pink" onclick="document.getElementById('step1').classList.add('hidden'); document.getElementById('step2').classList.remove('hidden');">Next Step</button>
        </div>
        <div id="step2" class="form-container hidden">
            <div class="tag-grid">
                <div class="tag" onclick="this.classList.toggle('selected')">Gamer</div>
                <div class="tag" onclick="this.classList.toggle('selected')">Techie</div>
                <div class="tag" onclick="this.classList.toggle('selected')">Developer</div>
                <div class="tag" onclick="this.classList.toggle('selected')">First Principles</div>
            </div>
            <button class="btn btn-pink" onclick="navigate('mapScreen')">Activate Radar</button>
        </div>
        <div></div>
    </div>

    <div id="mapScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 2.5rem;">RADAR</h1><p class="tagline">Live Intent Scanning</p></div>
        
        <div class="radar-container" id="radarField">
            <div class="radar-circle"></div>
            <div class="radar-pulse"></div>
            <div class="radar-pulse" style="animation-delay: 1.5s;"></div>
            <div class="radar-center"></div>
        </div>

        <div id="nodeProfile" class="node-popup">
            <div class="popup-name" id="popName">USER_ID</div>
            <div class="popup-tag" id="popTag">MATCH: Techie</div>
            <button class="btn btn-pink" style="height: 35px; font-size: 0.8rem; margin-top: 10px;" onclick="closePopup()">Send Ping</button>
        </div>

        <div class="btn-group">
            <button class="btn btn-pink" onclick="navigate('landingScreen')">Logout</button>
        </div>
    </div>

    <script>
        const mockUsers = [
            { name: "Josh_Dev", tag: "Developer" },
            { name: "NeonRider", tag: "Gamer" },
            { name: "LogicGate", tag: "First Principles" }
        ];

        function navigate(id) {
            document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.add('hidden'); });
            const target = document.getElementById(id);
            if(target) { target.classList.remove('hidden'); target.classList.add('active'); }
            
            // Toggle Background Grid visibility only on Radar
            const mapLayer = document.getElementById('globalMapLayer');
            if(id === 'mapScreen') { 
                mapLayer.classList.add('visible');
                startRadarSimulation(); 
            } else {
                mapLayer.classList.remove('visible');
            }
        }

        function startRadarSimulation() {
            const field = document.getElementById('radarField');
            document.querySelectorAll('.user-node').forEach(n => n.remove());

            for(let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const node = document.createElement('div');
                    node.className = 'user-node';
                    
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 40 + Math.random() * 100; 
                    const x = 160 + radius * Math.cos(angle) - 6;
                    const y = 160 + radius * Math.sin(angle) - 6;

                    node.style.left = x + 'px';
                    node.style.top = y + 'px';
                    node.style.animationDelay = (Math.random() * 2) + 's';
                    
                    // Interaction Handshake
                    node.onclick = () => showPopup(mockUsers[i].name, mockUsers[i].tag);
                    
                    field.appendChild(node);
                }, i * 1200);
            }
        }

        function showPopup(name, tag) {
            document.getElementById('popName').innerText = name;
            document.getElementById('popTag').innerText = "MATCH: " + tag;
            document.getElementById('nodeProfile').classList.add('show');
        }

        function closePopup() {
            document.getElementById('nodeProfile').classList.remove('show');
            alert("Ping Sent via Omnichannel Bridge.");
        }
    </script>
</body>
</html>
