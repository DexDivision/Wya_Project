<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQF0GRW2WG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date()); gtag('config', 'G-DQF0GRW2WG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WYA</title>
    
    <style>
        :root { --pink: #ff00ff; --green: #00ff41; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
        }

        .screen { 
            display: none; height: 100vh; width: 100vw; 
            flex-direction: column; align-items: center; justify-content: center; 
            padding: 30px; position: absolute; transition: 0.5s ease;
        }
        .active { display: flex; z-index: 10; }

        /* PULSING RADAR ANIMATION */
        .radar-pulse {
            width: 150px; height: 150px; border-radius: 50%;
            border: 2px solid var(--pink); position: relative;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 40px;
        }
        .radar-pulse::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            border-radius: 50%; border: 2px solid var(--pink);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .logo { font-size: 3.5rem; font-weight: 900; letter-spacing: 15px; margin: 0; text-shadow: 0 0 20px var(--pink); }
        .tagline { font-size: 0.7rem; letter-spacing: 5px; color: var(--pink); margin-top: 10px; opacity: 0.8; }

        /* BUTTONS */
        .btn {
            background: var(--pink); color: #000; border: none;
            padding: 20px 40px; border-radius: 20px; font-weight: 900;
            width: 100%; max-width: 280px; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.3);
            cursor: pointer; margin-top: 40px;
        }

        /* RADAR CARD */
        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 35px; width: 100%; max-width: 340px;
            padding: 40px 20px; text-align: center;
        }

        .dist-val { font-size: 4rem; font-weight: 900; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .label { font-size: 0.65rem; letter-spacing: 3px; color: #666; text-transform: uppercase; }
        
        .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px var(--green); }

        .deactivate { margin-top: 60px; font-size: 0.6rem; color: #333; letter-spacing: 2px; cursor: pointer; }
    </style>
</head>
<body onload="checkSession()">

    <div id="screen_splash" class="screen active">
        <div class="radar-pulse"><span style="font-size: 2rem;">📡</span></div>
        <h1 class="logo">WYA</h1>
        <p class="tagline">INTELLIGENCE OS</p>
        <button class="btn" onclick="navTo('screen_radar')">Enter Radar</button>
    </div>

    <div id="screen_radar" class="screen">
        <div class="glass-card">
            <div style="margin-bottom: 20px;"><span class="status-dot"></span><span class="label" style="color: var(--green)">Live Tracking</span></div>
            <p class="label">Nearest Move</p>
            <h2 style="margin: 5px 0; letter-spacing: 1px;">GHOST_ONE</h2>
            <div class="dist-val" id="distDisplay">--.-</div>
            <p class="label">Miles Away</p>
        </div>

        <div id="miniCoords" style="margin-top: 30px; font-size: 0.5rem; color: #222; font-family: monospace;"></div>
        <div class="deactivate" onclick="kill()">Deactivate Session</div>
    </div>

    <script>
        let gLat, gLon;

        function checkSession() {
            if(localStorage.getItem('wya_demo_v1')) {
                navTo('screen_radar');
            }
        }

        function navTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            localStorage.setItem('wya_demo_v1', 'true');
            if(id === 'screen_radar') startRadar();
            if(typeof gtag === 'function') gtag('event', 'screen_view', { 'screen_name': id });
        }

        function startRadar() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((p) => {
                    const lat = p.coords.latitude;
                    const lon = p.coords.longitude;
                    if(!gLat) { gLat = lat + 0.082; gLon = lon + 0.082; } // Fixed 6.1 mile offset
                    
                    const d = getDist(lat, lon, gLat, gLon);
                    document.getElementById('distDisplay').innerText = d.toFixed(1);
                    document.getElementById('miniCoords').innerText = `${lat.toFixed(4)} / ${lon.toFixed(4)}`;
                });
            }
        }

        function getDist(la1, lo1, la2, lo2) {
            const R = 3958.8;
            const dLat = (la2-la1)*Math.PI/180;
            const dLon = (lo2-lo1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function kill() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
