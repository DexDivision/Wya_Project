<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --glow-pink: 0 0 15px var(--neon-pink);
            --btn-glow-pink: 0 0 25px var(--neon-pink);
            
            /* Social Brand Colors */
            --apple: #ffffff; --google: #4285F4; --insta: #f09433; 
            --snap: #FFFC00; --fb: #1877F2; --x: #ffffff; --gmail: #EA4335;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            margin: 0; background: var(--bg); color: #FFF; 
            font-family: -apple-system, sans-serif; overflow: hidden; 
            height: 100vh; width: 100vw;
        }
        
        .screen { 
            height: 100%; width: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-between; padding: 40px 20px; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            position: absolute; top: 0; left: 0; background: #000;
        }
        
        .hidden { transform: translateX(100%); opacity: 0; pointer-events: none; z-index: 0; visibility: hidden; }
        .active { transform: translateX(0); opacity: 1; pointer-events: all; z-index: 10; visibility: visible; }

        /* HEADER */
        .header { text-align: center; margin-top: 20px; }
        .logo { font-size: 5rem; font-weight: 900; letter-spacing: 10px; margin: 0; color: var(--neon-pink); text-shadow: var(--glow-pink); }
        .tagline { color: var(--neon-pink); font-size: 1rem; text-transform: uppercase; margin-top: 5px; letter-spacing: 4px; font-weight: 800; text-shadow: var(--glow-pink); }

        /* FORMS & INPUTS */
        .form-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .input-field {
            width: 100%; height: 55px; background: #111; border: 2px solid #333; 
            border-radius: 12px; padding: 0 15px; color: #FFF; font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-field:focus { border-color: var(--neon-pink); box-shadow: var(--glow-pink); }

        /* BUTTONS */
        .btn-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .btn { 
            height: 55px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; text-transform: uppercase; transition: 0.2s; border: none;
        }
        .btn:active { transform: scale(0.96); }

        .btn-pink { 
            background: transparent; color: var(--neon-pink); 
            border: 4px solid var(--neon-pink) !important; 
            box-shadow: var(--btn-glow-pink); text-shadow: var(--glow-pink);
            width: 100%;
        }

        /* SOCIAL GRID */
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 5px; }
        .btn-social { background: #111; color: #FFF; border-width: 2px; border-style: solid; font-size: 0.75rem; border-radius: 10px; height: 50px; }

        /* SOCIAL THEMES */
        .apple { border-color: #555; box-shadow: 0 0 10px #555; }
        .google { border-color: var(--google); box-shadow: 0 0 10px var(--google); }
        .insta { border-color: #E1306C; box-shadow: 0 0 10px #E1306C; }
        .snap { border-color: var(--snap); color: var(--snap); box-shadow: 0 0 10px var(--snap); }
        .facebook { border-color: var(--fb); box-shadow: 0 0 10px var(--fb); }
        .x-com { border-color: #fff; box-shadow: 0 0 10px #fff; }
        .gmail { border-color: var(--gmail); box-shadow: 0 0 10px var(--gmail); }

        .footer-link { color: #888; font-size: 0.9rem; text-decoration: none; margin-bottom: 20px; cursor: pointer; text-align: center; }
        .footer-link span { color: var(--neon-pink); font-weight: bold; text-shadow: var(--glow-pink); }
    </style>
</head>
<body>

    <div id="landingScreen" class="screen active">
        <div class="header">
            <h1 class="logo">WYA</h1>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-pink" onclick="navigate('authScreen')">Get Started</button>
        </div>
        <div></div>
    </div>

    <div id="authScreen" class="screen hidden">
        <div class="header">
            <h1 class="logo" style="font-size: 3.5rem;">WYA</h1>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-pink" onclick="navigate('signUpScreen')">Create Account</button>
            <button class="btn btn-pink" onclick="navigate('signInScreen')">Sign In</button>
            
            <div class="social-grid">
                <button class="btn btn-social apple" onclick="socialAuth('Apple')">Apple</button>
                <button class="btn btn-social google" onclick="socialAuth('Google')">Google</button>
                <button class="btn btn-social insta" onclick="socialAuth('Instagram')">Instagram</button>
                <button class="btn btn-social snap" onclick="socialAuth('Snapchat')">Snapchat</button>
                <button class="btn btn-social facebook" onclick="socialAuth('Facebook')">Facebook</button>
                <button class="btn btn-social x-com" onclick="socialAuth('X')">X</button>
                <button class="btn btn-social gmail" onclick="socialAuth('Gmail')">Gmail</button>
                <button class="btn btn-social" style="border-color:#333">More...</button>
            </div>
        </div>
        <div class="footer-link" onclick="navigate('signInScreen')">Already have an account? <span>Sign In</span></div>
    </div>

    <div id="signUpScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3rem;">JOIN</h1><p class="tagline">Create Account</p></div>
        
        <form class="form-container" onsubmit="event.preventDefault(); handleForm('Sign Up')">
            <input type="text" class="input-field" placeholder="Username" required>
            <input type="email" class="input-field" placeholder="Email" required>
            <input type="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="btn btn-pink">Register</button>
        </form>

        <div class="footer-link" onclick="navigate('authScreen')"><span>Back to Menu</span></div>
    </div>

    <div id="signInScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3rem;">LOGIN</h1><p class="tagline">Welcome Back</p></div>
        
        <form class="form-container" onsubmit="event.preventDefault(); handleForm('Sign In')">
            <input type="text" class="input-field" placeholder="Username or Email" required>
            <input type="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="btn btn-pink">Login</button>
            <div style="color: #666; font-size: 0.8rem; text-align: center; margin-top: -5px;">Forgot Password?</div>
        </form>

        <div class="footer-link" onclick="navigate('authScreen')"><span>Back to Menu</span></div>
    </div>

    <script>
        function navigate(id) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                s.classList.add('hidden');
            });
            const target = document.getElementById(id);
            if(target) {
                target.classList.remove('hidden');
                target.classList.add('active');
            }
        }

        function socialAuth(provider) {
            alert("Connecting to " + provider + "...");
        }

        function handleForm(type) {
            alert(type + " Successful! Welcome to WYA.");
            navigate('landingScreen');
        }
    </script>
</body>
</html>
