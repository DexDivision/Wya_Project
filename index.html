<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --glow: 0 0 15px var(--neon-pink);
            --btn-glow: 0 0 25px var(--neon-pink);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: #FFF; 
            font-family: -apple-system, sans-serif; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }
        
        .screen { 
            height: 100%; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 60px 20px; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            position: absolute; 
            top: 0;
            left: 0;
            background: #000;
        }
        
        /* FIX: Added pointer-events and z-index to prevent ghosting */
        .hidden { 
            transform: translateX(-100%); 
            opacity: 0; 
            pointer-events: none; 
            z-index: 0;
            visibility: hidden; /* Ensures it is fully removed from render */
        }
        
        .active { 
            transform: translateX(0); 
            opacity: 1; 
            pointer-events: all; 
            z-index: 10;
            visibility: visible;
        }

        /* HEADER & NEON STYLES */
        .header { text-align: center; margin-top: 40px; }
        .logo { 
            font-size: 5rem; 
            font-weight: 900; 
            letter-spacing: 10px; 
            margin: 0; 
            color: var(--neon-pink); 
            text-shadow: var(--glow);
        }
        .tagline { 
            color: var(--neon-pink); 
            font-size: 1rem; 
            text-transform: uppercase; 
            margin-top: 5px; 
            letter-spacing: 4px;
            font-weight: 800;
            text-shadow: var(--glow);
        }

        /* BUTTONS */
        .btn-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .btn { 
            height: 60px; 
            border-radius: 12px; 
            font-size: 1.2rem; 
            font-weight: 900; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none;
            text-transform: uppercase;
        }

        .btn-primary { 
            background: transparent; 
            color: var(--neon-pink); 
            border: 4px solid var(--neon-pink); 
            box-shadow: var(--btn-glow);
            text-shadow: var(--glow);
        }

        .btn-secondary { background: transparent; color: #FFF; border: 2px solid #FFF; }

        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
        .btn-social { height: 48px; background: #111; color: #FFF; border: 1px solid #333; font-size: 0.8rem; border-radius: 8px; font-weight: 600; }

        .footer-link { color: #888; font-size: 0.9rem; text-decoration: none; margin-bottom: 20px; }
        .footer-link span { color: var(--neon-pink); font-weight: bold; text-shadow: var(--glow); text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="landingScreen" class="screen active">
        <div class="header">
            <h1 class="logo">WYA</h1>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="showAuth()">Get Started</button>
        </div>
        <div></div>
    </div>

    <div id="authScreen" class="screen hidden">
        <div class="header">
            <h1 class="logo" style="font-size: 3.5rem;">WYA</h1>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary">Create Account</button>
            <button class="btn btn-secondary">Sign In</button>
            <div class="social-grid">
                <button class="btn btn-social">Apple</button>
                <button class="btn btn-social">Google</button>
                <button class="btn btn-social">Instagram</button>
                <button class="btn btn-social">Snapchat</button>
                <button class="btn btn-social">Facebook</button>
                <button class="btn btn-social">X (Twitter)</button>
                <button class="btn btn-social">Gmail</button>
                <button class="btn btn-social">More...</button>
            </div>
        </div>
        <a href="#" class="footer-link">Already have an account? <span>Sign In</span></a>
    </div>

    <script>
        function showAuth() {
            // Mechanics: Immediate z-index and visibility kill to prevent "ghost" buttons
            const landing = document.getElementById('landingScreen');
            const auth = document.getElementById('authScreen');
            
            landing.classList.remove('active');
            landing.classList.add('hidden');
            
            auth.classList.remove('hidden');
            auth.classList.add('active');
        }
    </script>
</body>
</html>
