<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYA</title>
    <style>
        /* RESTORED ORIGINAL UI STYLES */
        :root { --bg: #000; --text: #FFF; --accent: #888; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
        
        .screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 50px 20px; box-sizing: border-box; transition: transform 0.5s ease-in-out; position: absolute; }
        
        /* TRANSITION LOGIC */
        .hidden { transform: translateX(100%); }
        .active { transform: translateX(0); }

        .header { text-align: center; margin-top: 50px; }
        .logo { font-size: 3rem; font-weight: 900; letter-spacing: 5px; margin: 0; }
        .tagline { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; margin-top: 5px; }

        .btn-group { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .btn { height: 55px; border-radius: 12px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-primary { background: #FFF; color: #000; }
        .btn-secondary { background: transparent; color: #FFF; border: 1.5px solid #FFF; }

        /* ADDED SOCIAL GRID (Maintained original aesthetic) */
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
        .btn-social { height: 45px; background: #111; color: #FFF; border: 1px solid #333; font-size: 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .footer-link { color: var(--accent); font-size: 0.9rem; text-decoration: none; margin-bottom: 30px; }
        .footer-link span { color: #FFF; font-weight: bold; }
    </style>
</head>
<body>

    <div id="landingScreen" class="screen active">
        <div class="header">
            <p class="logo">WYA</p>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="showAuth()">Get Started</button>
        </div>
        <div></div>
    </div>

    <div id="authScreen" class="screen hidden">
        <div class="header">
            <p class="logo">WYA</p>
            <p class="tagline">Connect with the Network</p>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary">Create Account</button>
            <button class="btn btn-secondary">Sign In</button>
            
            <div class="social-grid">
                <button class="btn btn-social">Apple</button>
                <button class="btn btn-social">Google</button>
                <button class="btn btn-social">Instagram</button>
                <button class="btn btn-social">Snapchat</button>
                <button class="btn btn-social">Facebook</button>
                <button class="btn btn-social">X (Twitter)</button>
            </div>
        </div>

        <a href="#" class="footer-link">Already have an account? <span>Log In</span></a>
    </div>

    <script>
        function showAuth() {
            // Mechanics: Hide landing, show auth
            document.getElementById('landingScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('authScreen').classList.add('active');
        }
    </script>
</body>
</html>
