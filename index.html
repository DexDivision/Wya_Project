<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQF0GRW2WG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DQF0GRW2WG', { 'debug_mode': true });
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA V3.3.2 - THE OBSERVER</title>
    <style>
        :root { --bg: #000; --neon-pink: #ff00ff; --glow-pink: 0 0 15px var(--neon-pink); }
        body { margin: 0; background: var(--bg); color: #FFF; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #versionTag { position: fixed; top: 15px; right: 20px; font-size: 0.6rem; color: var(--neon-pink); font-weight: 900; letter-spacing: 2px; }
        .logo { font-size: 4rem; color: var(--neon-pink); text-shadow: var(--glow-pink); letter-spacing: 12px; font-weight: 900; }
        .btn-primary { height: 60px; border-radius: 16px; font-size: 1rem; font-weight: 900; border: 2px solid var(--neon-pink); background: transparent; color: var(--neon-pink); width: 80%; max-width: 320px; box-shadow: 0 0 20px var(--neon-pink); cursor: pointer; margin-top: 30px; text-transform: uppercase; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .active { display: flex; }
    </style>
</head>
<body>
    <div id="versionTag">FAITH_OS_V3.3.2</div>

    <div id="screen_splash" class="screen active">
        <h1 class="logo">WYA</h1>
        <button class="btn-primary" onclick="navTo('screen_radar')">Initialize OS</button>
    </div>

    <div id="screen_radar" class="screen">
        <h2 style="color: var(--neon-pink)">RADAR ACTIVE</h2>
        <p>Intelligence Stream: G-DQF0GRW2WG</p>
        <button class="btn-primary" onclick="location.reload()">Reset Session</button>
    </div>

    <script>
        function navTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(typeof gtag === 'function') {
                gtag('event', 'screen_view', { 'screen_name': id });
            }
        }
    </script>
</body>
</html>
