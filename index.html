<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA V1.7.1</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --glow-pink: 0 0 15px var(--neon-pink); 
            --btn-glow-pink: 0 0 25px var(--neon-pink); 
            --sidebar-bg: rgba(5, 5, 5, 0.98);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #FFF; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* Version Stamp */
        #versionTag { position: fixed; top: 15px; right: 20px; font-size: 0.7rem; color: var(--neon-pink); font-weight: 900; z-index: 1000; letter-spacing: 2px; text-shadow: var(--glow-pink); }

        /* Navigation & Screens */
        .screen { height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease; position: absolute; top: 0; left: 0; background: transparent; z-index: 10; }
        .hidden { transform: translateX(100%); opacity: 0; pointer-events: none; z-index: 0; visibility: hidden; }
        .active { transform: translateX(0); opacity: 1; pointer-events: all; z-index: 10; visibility: visible; }
        
        /* UI Elements */
        .header { text-align: center; margin-top: 20px; z-index: 20; }
        .logo { font-size: 3.5rem; font-weight: 900; letter-spacing: 8px; margin: 0; color: var(--neon-pink); text-shadow: var(--glow-pink); }
        .tagline { color: var(--neon-pink); font-size: 0.8rem; text-transform: uppercase; margin-top: 5px; letter-spacing: 4px; font-weight: 800; text-shadow: var(--glow-pink); }
        
        /* Sidebar Styles */
        #sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100%; background: var(--sidebar-bg); border-right: 2px solid var(--neon-pink); transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; padding: 80px 20px; box-shadow: 10px 0 30px rgba(255, 0, 255, 0.2); }
        #sidebar.open { transform: translateX(0); }
        .sidebar-toggle { position: fixed; left: 20px; top: 15px; z-index: 110; font-size: 1.8rem; color: var(--neon-pink); cursor: pointer; text-shadow: var(--glow-pink); background: none; border: none; font-weight: 900; }
        .user-list-item { padding: 15px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .user-list-item:active { background: rgba(255, 0, 255, 0.2); }
        .status-dot { width: 10px; height: 10px; background: var(--neon-pink); border-radius: 50%; box-shadow: var(--glow-pink); }

        /* Compass UI */
        .compass-container { position: absolute; bottom: 120px; width: 85px; height: 85px; border: 2px solid var(--neon-pink); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: var(--glow-pink); background: rgba(0,0,0,0.5); }
        .compass-needle { width: 3px; height: 45px; background: var(--neon-pink); position: relative; transition: transform 0.2s ease-out; box-shadow: var(--glow-pink); }
        .compass-needle::after { content: 'N'; position: absolute; top: -20px; left: -4px; font-size: 11px; font-weight: 900; color: var(--neon-pink); }

        /* Radar Core */
        .map-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255, 0, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 255, 0.05) 1px, transparent 1px); background-size: 50px 50px; opacity: 0; z-index: 1; transition: opacity 1s ease; }
        .map-layer.visible { opacity: 1; }
        .radar-container { position: relative; width: 340px; height: 340px; display: flex; justify-content: center; align-items: center; z-index: 20; }
        .radar-circle { position: absolute; width: 100%; height: 100%; border: 1px solid rgba(255, 0, 255, 0.2); border-radius: 50%; background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%); }
        .radar-pulse { position: absolute; width: 100%; height: 100%; border: 2px solid var(--neon-pink); border-radius: 50%; animation: pulse 4s infinite linear; opacity: 0; }
        .radar-center { width: 12px; height: 12px; background: #FFF; border-radius: 50%; box-shadow: 0 0 20px #FFF; z-index: 30; }
        
        .user-node { position: absolute; width: 16px; height: 16px; background: var(--neon-pink); border-radius: 50%; box-shadow: var(--glow-pink); opacity: 0; animation: fadeIn 0.5s forwards; cursor: pointer; z-index: 40; }

        /* Buttons */
        .btn-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 20; }
        .btn { height: 60px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; transition: 0.2s; border: none; }
        .btn-pink { background: transparent; color: var(--neon-pink); border: 2px solid var(--neon-pink); box-shadow: var(--btn-glow-pink); text-shadow: var(--glow-pink); width: 100%; }
        
        @keyframes pulse { 0% { transform: scale(0); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="versionTag">V1.7.1</div>
    
    <div id="sidebar">
        <h2 style="color: var(--neon-pink); text-transform: uppercase; letter-spacing: 3px; font-size: 1.2rem;">Local Intent</h2>
        <div id="userList"></div>
    </div>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

    <div id="globalMapLayer" class="map-layer"></div>

    <div id="landingScreen" class="screen active">
        <div class="header"><h1 class="logo">WYA</h1><p class="tagline">Real-Time Social Radar</p></div>
        <div class="btn-group"><button class="btn btn-pink" onclick="navigate('mapScreen')">Initialize Radar</button></div>
    </div>

    <div id="mapScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 2rem;">RADAR</h1></div>
        
        <div class="radar-container" id="radarField">
            <div class="radar-circle"></div>
            <div class="radar-pulse"></div>
            <div class="radar-center"></div>
        </div>

        <div class="compass-container">
            <div class="compass-needle" id="compassNeedle"></div>
        </div>

        <div class="btn-group">
            <button class="btn btn-pink" onclick="navigate('landingScreen')">Deactivate</button>
        </div>
    </div>

    <script>
        const mockUsers = [
            { name: "Alpha_01", tag: "Tech", dist: "50m", angle: 45 },
            { name: "Neon_Ghost", tag: "Gamer", dist: "120m", angle: 130 },
            { name: "Founder_X", tag: "Logic", dist: "10m", angle: 280 }
        ];

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('open');
            if(sb.classList.contains('open')) populateSidebar();
        }

        function populateSidebar() {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            mockUsers.forEach(user => {
                const item = document.createElement('div');
                item.className = 'user-list-item';
                item.innerHTML = `<div><strong style="color:var(--neon-pink)">${user.name}</strong><br><small style="color:#888">${user.dist}</small></div><div class="status-dot"></div>`;
                list.appendChild(item);
            });
        }

        function navigate(id) {
            document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.add('hidden'); });
            document.getElementById(id).classList.add('active');
            
            const mapLayer = document.getElementById('globalMapLayer');
            if(id === 'mapScreen') {
                mapLayer.classList.add('visible');
                renderNodes();
                startCompassSimulation();
            } else {
                mapLayer.classList.remove('visible');
            }
        }

        function renderNodes() {
            const field = document.getElementById('radarField');
            document.querySelectorAll('.user-node').forEach(n => n.remove());
            
            mockUsers.forEach(user => {
                const node = document.createElement('div');
                node.className = 'user-node';
                const radius = 100 + (Math.random() * 50);
                const x = 170 + radius * Math.cos(user.angle * Math.PI / 180) - 8;
                const y = 170 + radius * Math.sin(user.angle * Math.PI / 180) - 8;
                node.style.left = x + 'px';
                node.style.top = y + 'px';
                field.appendChild(node);
            });
        }

        function startCompassSimulation() {
            const needle = document.getElementById('compassNeedle');
            setInterval(() => {
                const rotation = Math.floor(Math.random() * 12) - 6; 
                needle.style.transform = `rotate(${rotation}deg)`;
            }, 400);
        }
    </script>
</body>
</html>
