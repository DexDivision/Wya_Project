<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --glow-pink: 0 0 15px var(--neon-pink);
            --btn-glow-pink: 0 0 25px var(--neon-pink);
            
            /* Social Brand Neon Colors */
            --apple: #ffffff; --google: #4285F4; --insta: #E1306C; 
            --snap: #FFFC00; --fb: #1877F2; --x: #ffffff; --gmail: #EA4335;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            margin: 0; background: var(--bg); color: #FFF; 
            font-family: -apple-system, sans-serif; overflow: hidden; 
            height: 100vh; width: 100vw;
        }
        
        .screen { 
            height: 100%; width: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-between; padding: 60px 20px; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            position: absolute; top: 0; left: 0; background: #000;
        }
        
        .hidden { transform: translateX(100%); opacity: 0; pointer-events: none; z-index: 0; visibility: hidden; }
        .active { transform: translateX(0); opacity: 1; pointer-events: all; z-index: 10; visibility: visible; }

        /* HEADER SECTION */
        .header { text-align: center; margin-top: 20px; }
        .logo { font-size: 4rem; font-weight: 900; letter-spacing: 10px; margin: 0; color: var(--neon-pink); text-shadow: var(--glow-pink); }
        .tagline { color: var(--neon-pink); font-size: 0.9rem; text-transform: uppercase; margin-top: 5px; letter-spacing: 4px; font-weight: 800; text-shadow: var(--glow-pink); }

        /* RADAR UI */
        .radar-container { position: relative; width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .radar-circle { position: absolute; width: 100%; height: 100%; border: 1px solid rgba(255, 0, 255, 0.2); border-radius: 50%; box-shadow: inset 0 0 20px rgba(255, 0, 255, 0.1); }
        .radar-pulse { position: absolute; width: 100%; height: 100%; border: 2px solid var(--neon-pink); border-radius: 50%; animation: pulse 3s infinite; opacity: 0; }
        .radar-center { width: 12px; height: 12px; background: var(--neon-pink); border-radius: 50%; box-shadow: var(--btn-glow-pink); z-index: 10; }
        
        /* NODE STYLING (The Users) */
        .user-node {
            position: absolute; width: 8px; height: 8px; background: var(--neon-pink); 
            border-radius: 50%; box-shadow: var(--glow-pink); opacity: 0;
            animation: fadeInOut 4s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* BUTTONS */
        .btn-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .btn { height: 55px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; transition: 0.2s; border: none; }
        .btn-pink { background: transparent; color: var(--neon-pink); border: 4px solid var(--neon-pink) !important; box-shadow: var(--btn-glow-pink); text-shadow: var(--glow-pink); width: 100%; }
        .btn-social { background: #111; color: #FFF; border-width: 2px; border-style: solid; font-size: 0.75rem; border-radius: 10px; height: 50px; }

        /* BRAND NEON */
        .apple { border-color: var(--apple); box-shadow: 0 0 10px var(--apple); }
        .google { border-color: var(--google); box-shadow: 0 0 10px var(--google); }
        .insta { border-color: var(--insta); box-shadow: 0 0 10px var(--insta); }
        .snap { border-color: var(--snap); box-shadow: 0 0 10px var(--snap); }
        .facebook { border-color: var(--fb); box-shadow: 0 0 10px var(--fb); }
        .x-com { border-color: var(--x); box-shadow: 0 0 10px var(--x); }
        .gmail { border-color: var(--gmail); box-shadow: 0 0 10px var(--gmail); }

        .tag-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .tag { padding: 10px 18px; border: 1.5px solid #444; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: #888; cursor: pointer; }
        .tag.selected { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: var(--glow-pink); }

        .footer-link { color: #888; font-size: 0.9rem; text-decoration: none; margin-bottom: 20px; cursor: pointer; text-align: center; }
        .footer-link span { color: var(--neon-pink); font-weight: bold; text-shadow: var(--glow-pink); }
    </style>
</head>
<body>

    <div id="landingScreen" class="screen active">
        <div class="header"><h1 class="logo">WYA</h1><p class="tagline">Where You At?</p></div>
        <div class="btn-group"><button class="btn btn-pink" onclick="navigate('authScreen')">Get Started</button></div>
        <div></div>
    </div>

    <div id="authScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3.5rem;">WYA</h1><p class="tagline">Where You At?</p></div>
        <div class="btn-group">
            <button class="btn btn-pink" onclick="navigate('signUpScreen')">Create Account</button>
            <button class="btn btn-pink" onclick="navigate('signInScreen')">Sign In</button>
            <div class="social-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;">
                <button class="btn btn-social apple" onclick="socialAuth('Apple')">Apple</button>
                <button class="btn btn-social google" onclick="socialAuth('Google')">Google</button>
                <button class="btn btn-social insta" onclick="socialAuth('Instagram')">Instagram</button>
                <button class="btn btn-social snap" onclick="socialAuth('Snapchat')">Snapchat</button>
                <button class="btn btn-social facebook" onclick="socialAuth('Facebook')">Facebook</button>
                <button class="btn btn-social x-com" onclick="socialAuth('X')">X</button>
                <button class="btn btn-social gmail" onclick="socialAuth('Gmail')">Gmail</button>
                <button class="btn btn-social" style="border-color:#333">More...</button>
            </div>
        </div>
        <div class="footer-link" onclick="navigate('signInScreen')">Already have an account? <span>Sign In</span></div>
    </div>

    <div id="signUpScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3rem;">JOIN</h1><p class="tagline">Create Account</p></div>
        <form class="form-container" style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:400px;" onsubmit="processForm(event, 'onboardingScreen')">
            <input name="username" type="text" style="width:100%; height:55px; background:#111; border:2px solid #333; border-radius:12px; padding:0 15px; color:#FFF;" placeholder="Username" required>
            <input name="email" type="email" style="width:100%; height:55px; background:#111; border:2px solid #333; border-radius:12px; padding:0 15px; color:#FFF;" placeholder="Email" required>
            <input name="password" type="password" style="width:100%; height:55px; background:#111; border:2px solid #333; border-radius:12px; padding:0 15px; color:#FFF;" placeholder="Password" required>
            <button type="submit" class="btn btn-pink">Register</button>
        </form>
        <div class="footer-link" onclick="navigate('authScreen')"><span>Back</span></div>
    </div>

    <div id="signInScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 3rem;">LOGIN</h1><p class="tagline">Welcome Back</p></div>
        <form class="form-container" style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:400px;" onsubmit="processForm(event, 'onboardingScreen')">
            <input name="loginID" type="text" style="width:100%; height:55px; background:#111; border:2px solid #333; border-radius:12px; padding:0 15px; color:#FFF;" placeholder="Username or Email" required>
            <input name="password" type="password" style="width:100%; height:55px; background:#111; border:2px solid #333; border-radius:12px; padding:0 15px; color:#FFF;" placeholder="Password" required>
            <button type="submit" class="btn btn-pink">Login</button>
        </form>
        <div class="footer-link" onclick="navigate('authScreen')"><span>Back</span></div>
    </div>

    <div id="onboardingScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 2.5rem;">SETUP</h1><p class="tagline">AI Personalization</p></div>
        <div id="step1" style="width:100%; max-width:400px; display:flex; flex-direction:column; gap:12px;">
            <input type="text" style="width:100%; height:55px; background:#111; border:2px solid #333; border-radius:12px; padding:0 15px; color:#FFF;" placeholder="Display Name">
            <textarea style="width:100%; height:100px; background:#111; border:2px solid #333; border-radius:12px; padding:15px; color:#FFF; resize:none;" placeholder="Short Bio..."></textarea>
            <button class="btn btn-pink" onclick="nextOnboarding()">Next Step</button>
        </div>
        <div id="step2" class="hidden" style="width:100%; max-width:400px;">
            <div class="tag-grid">
                <div class="tag" onclick="this.classList.toggle('selected')">Gamer</div>
                <div class="tag" onclick="this.classList.toggle('selected')">Techie</div>
                <div class="tag" onclick="this.classList.toggle('selected')">Developer</div>
                <div class="tag" onclick="this.classList.toggle('selected')">First Principles</div>
            </div>
            <button class="btn btn-pink" onclick="finishOnboarding()">Activate Radar</button>
        </div>
        <div></div>
    </div>

    <div id="mapScreen" class="screen hidden">
        <div class="header"><h1 class="logo" style="font-size: 2.5rem;">RADAR</h1><p class="tagline">Live Intent Scanning</p></div>
        
        <div class="radar-container" id="radarField">
            <div class="radar-circle"></div>
            <div class="radar-pulse"></div>
            <div class="radar-pulse" style="animation-delay: 1.5s;"></div>
            <div class="radar-center"></div>
            </div>

        <div class="btn-group">
            <button class="btn btn-pink" onclick="navigate('landingScreen')">Logout</button>
        </div>
    </div>

    <script>
        function navigate(id) {
            document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.add('hidden'); });
            const target = document.getElementById(id);
            if(target) { target.classList.remove('hidden'); target.classList.add('active'); }
            
            // Trigger Radar Simulation if moving to Map
            if(id === 'mapScreen') { startRadarSimulation(); }
        }

        function processForm(event, nextScreen) { event.preventDefault(); navigate(nextScreen); }

        function nextOnboarding() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function finishOnboarding() {
            alert("Profile 100% Complete.");
            navigate('mapScreen'); 
        }

        function socialAuth(provider) { alert("Handshake with " + provider); setTimeout(() => { navigate('onboardingScreen'); }, 1000); }

        // GEOSPATIAL INSTANTIATION LOGIC
        function startRadarSimulation() {
            const field = document.getElementById('radarField');
            // Clear old nodes
            document.querySelectorAll('.user-node').forEach(n => n.remove());

            // Generate 3-5 random intent-matched nodes
            for(let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const node = document.createElement('div');
                    node.className = 'user-node';
                    
                    // Random positioning within circle (Polar coordinates for safety)
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 140; // Max 160px from center
                    const x = 160 + radius * Math.cos(angle) - 4;
                    const y = 160 + radius * Math.sin(angle) - 4;

                    node.style.left = x + 'px';
                    node.style.top = y + 'px';
                    node.style.animationDelay = (Math.random() * 2) + 's';
                    
                    field.appendChild(node);
                }, i * 800);
            }
        }
    </script>
</body>
</html>
