<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYA</title>
    <style>
        :root { 
            --bg: #000; 
            --neon-pink: #ff00ff; 
            --glow: 0 0 15px var(--neon-pink);
            --btn-glow: 0 0 25px var(--neon-pink);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: #FFF; 
            font-family: -apple-system, sans-serif; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }
        
        .screen { 
            height: 100%; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 60px 20px; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            position: absolute; 
            top: 0;
            left: 0;
            background: #000;
        }
        
        .hidden { 
            transform: translateX(100%); 
            opacity: 0; 
            pointer-events: none; 
            z-index: 0;
            visibility: hidden;
        }
        
        .active { 
            transform: translateX(0); 
            opacity: 1; 
            pointer-events: all; 
            z-index: 10;
            visibility: visible;
        }

        /* HEADER & NEON STYLES */
        .header { text-align: center; margin-top: 40px; }
        .logo { 
            font-size: 5rem; 
            font-weight: 900; 
            letter-spacing: 10px; 
            margin: 0; 
            color: var(--neon-pink); 
            text-shadow: var(--glow);
        }
        .tagline { 
            color: var(--neon-pink); 
            font-size: 1rem; 
            text-transform: uppercase; 
            margin-top: 5px; 
            letter-spacing: 4px;
            font-weight: 800;
            text-shadow: var(--glow);
        }

        /* BUTTONS */
        .btn-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .btn { 
            height: 60px; 
            border-radius: 12px; 
            font-size: 1.2rem; 
            font-weight: 900; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none;
            text-transform: uppercase;
            transition: 0.2s;
            border: none;
        }
        .btn:active { transform: scale(0.96); opacity: 0.8; }

        .btn-primary { 
            background: transparent; 
            color: var(--neon-pink); 
            border: 4px solid var(--neon-pink) !important; 
            box-shadow: var(--btn-glow);
            text-shadow: var(--glow);
        }

        .btn-secondary { background: transparent; color: #FFF; border: 2px solid #FFF !important; }

        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
        .btn-social { height: 48px; background: #111; color: #FFF; border: 1px solid #333; font-size: 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .footer-link { color: #888; font-size: 0.9rem; text-decoration: none; margin-bottom: 20px; cursor: pointer; }
        .footer-link span { color: var(--neon-pink); font-weight: bold; text-shadow: var(--glow); text-transform: uppercase; }

        /* PLACEHOLDER FORM STYLING */
        .form-info { color: #FFF; text-align: center; font-size: 1.2rem; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="landingScreen" class="screen active">
        <div class="header">
            <h1 class="logo">WYA</h1>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="navigateTo('authScreen')">Get Started</button>
        </div>
        <div></div>
    </div>

    <div id="authScreen" class="screen hidden">
        <div class="header">
            <h1 class="logo" style="font-size: 3.5rem;">WYA</h1>
            <p class="tagline">Where You At?</p>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="navigateTo('signUpScreen')">Create Account</button>
            <button class="btn btn-secondary" onclick="navigateTo('signInScreen')">Sign In</button>
            <div class="social-grid">
                <button class="btn btn-social" onclick="socialAuth('Apple')">Apple</button>
                <button class="btn btn-social" onclick="socialAuth('Google')">Google</button>
                <button class="btn btn-social" onclick="socialAuth('Instagram')">Instagram</button>
                <button class="btn btn-social" onclick="socialAuth('Snapchat')">Snapchat</button>
                <button class="btn btn-social" onclick="socialAuth('Facebook')">Facebook</button>
                <button class="btn btn-social" onclick="socialAuth('X')">X (Twitter)</button>
                <button class="btn btn-social" onclick="socialAuth('Gmail')">Gmail</button>
                <button class="btn btn-social" onclick="socialAuth('More')">More...</button>
            </div>
        </div>
        <div class="footer-link" onclick="navigateTo('signInScreen')">Already have an account? <span>Sign In</span></div>
    </div>

    <div id="signUpScreen" class="screen hidden">
        <div class="header">
            <h1 class="logo" style="font-size: 3rem;">JOIN</h1>
            <p class="tagline">Create your WYA Profile</p>
        </div>
        <div class="form-info">Sign Up Form Coming Soon...</div>
        <button class="btn btn-secondary" style="width: 80%;" onclick="navigateTo('authScreen')">Back</button>
        <div></div>
    </div>

    <div id="signInScreen" class="screen hidden">
        <div class="header">
            <h1 class="logo" style="font-size: 3rem;">LOGIN</h1>
            <p class="tagline">Welcome Back</p>
        </div>
        <div class="form-info">Sign In Form Coming Soon...</div>
        <button class="btn btn-secondary" style="width: 80%;" onclick="navigateTo('authScreen')">Back</button>
        <div></div>
    </div>

    <script>
        // Global Navigation Controller
        function navigateTo(targetId) {
            // Hide all screens
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => {
                screen.classList.remove('active');
                screen.classList.add('hidden');
            });

            // Activate Target Screen
            const target = document.getElementById(targetId);
            target.classList.remove('hidden');
            target.classList.add('active');
        }

        // Social Auth Handler
        function socialAuth(provider) {
            alert("Connecting to " + provider + " API...");
            // Logic for OAuth redirection goes here
        }
    </script>
</body>
</html>
