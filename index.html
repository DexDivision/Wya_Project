<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQF0GRW2WG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date()); gtag('config', 'G-DQF0GRW2WG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WYA V3.8.0</title>
    
    <style>
        :root { --pink: #ff00ff; --green: #00ff41; --glass: rgba(255, 255, 255, 0.08); --blur: blur(25px); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
        }

        .screen { 
            display: none; height: 100vh; width: 100vw; 
            flex-direction: column; align-items: center; justify-content: center; 
            padding: 30px; position: absolute; background: #000;
        }
        .active { display: flex; z-index: 10; }

        /* SIDE DRAWER */
        #userDrawer {
            position: fixed; top: 0; left: -100%; width: 80%; height: 100%;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: var(--blur);
            z-index: 200; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid var(--pink); padding: 80px 20px;
        }
        #userDrawer.open { left: 0; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 150; }
        .drawer-overlay.open { display: block; }

        .top-nav { position: absolute; top: 60px; width: 90%; display: flex; justify-content: space-between; z-index: 100; }
        .nav-icon { font-size: 1.2rem; cursor: pointer; opacity: 0.7; }

        .logo { font-size: 3.5rem; font-weight: 900; letter-spacing: 12px; color: var(--pink); text-shadow: 0 0 20px var(--pink); }
        
        .btn {
            background: var(--pink); color: #000; border: none; padding: 18px; border-radius: 15px;
            font-weight: 900; width: 100%; max-width: 300px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; margin-top: 20px;
        }

        /* PROFILE & TAGS */
        .tag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin: 20px 0; max-height: 200px; overflow-y: auto; }
        .tag { background: var(--glass); border: 1px solid #333; padding: 12px; border-radius: 10px; font-size: 0.7rem; font-weight: 800; cursor: pointer; text-align: center; }
        .tag.selected { border-color: var(--pink); color: var(--pink); background: rgba(255,0,255,0.1); }
        
        .custom-tag-box { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
        .input-minimal { background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; padding: 10px; flex: 1; font-size: 0.8rem; }

        /* RADAR FIELD */
        .radar-field { width: 320px; height: 320px; border: 1px solid rgba(255,0,255,0.2); border-radius: 50%; position: relative; margin-top: 20px; display: flex; align-items: center; justify-content: center; }
        .user-node { position: absolute; width: 6px; height: 6px; background: var(--pink); border-radius: 50%; box-shadow: 0 0 10px var(--pink); }
        .center-node { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #fff; z-index: 2; }

        .user-list-item { border-bottom: 1px solid #222; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .label { font-size: 0.6rem; letter-spacing: 3px; color: #555; text-transform: uppercase; }
    </style>
</head>
<body onload="init()">

    <div id="userDrawer">
        <h2 class="label">Geofence Radius: 5mi</h2>
        <div id="geofenceList"></div>
    </div>
    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>

    <div id="screen_splash" class="screen active">
        <h1 class="logo">WYA</h1>
        <button class="btn" onclick="navTo('screen_tos')">Initialize</button>
    </div>

    <div id="screen_tos" class="screen">
        <div style="background: var(--glass); padding: 30px; border-radius: 20px; border: 1px solid #222;">
            <p class="label">Legal Protocol</p>
            <p style="font-size: 0.75rem; color: #888; line-height: 1.6;">Precision location tracking required. Data is anonymized. By entering, you agree to the WYA Observer status.</p>
            <button class="btn" onclick="navTo('screen_profile')">Accept</button>
        </div>
    </div>

    <div id="screen_profile" class="screen">
        <p class="label">Architect Setup</p>
        <input type="text" id="userName" placeholder="DISPLAY NAME (REQUIRED)" class="input-minimal" style="width: 100%; max-width: 300px; text-align: center; margin-bottom: 20px; border-color: var(--pink);">
        
        <div class="tag-grid" id="tagGrid"></div>
        
        <div class="custom-tag-box">
            <input type="text" id="customTagInput" placeholder="ADD CUSTOM TAG" class="input-minimal">
            <button onclick="addCustomTag()" style="background: transparent; border: 1px solid var(--pink); color: var(--pink); border-radius: 8px; padding: 0 15px;">+</button>
        </div>
        
        <button class="btn" onclick="validateAndGo()">Sync to Radar</button>
    </div>

    <div id="screen_radar" class="screen">
        <div class="top-nav">
            <div class="nav-icon" onclick="toggleDrawer()">☰ Users</div>
            <div class="nav-icon" onclick="hardReset()">✕</div>
        </div>

        <p class="label" id="activeName">Architect</p>
        
        <div class="radar-field" id="field">
            <div class="center-node"></div>
        </div>

        <div style="margin-top: 40px; text-align: center;">
            <div style="color: var(--green); font-size: 0.7rem; font-weight: 900; letter-spacing: 2px;">● GEOFENCE ACTIVE</div>
            <p id="coordDisplay" style="font-size: 0.5rem; color: #333; font-family: monospace; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        let availableTags = ["NIGHTLIFE", "GYM", "GAMING", "STUDY", "LOUNGE", "BEACH"];
        let selectedTags = [];
        let mockUsers = ["User_77", "User_04", "Ghost_One", "Viper_Node", "Alpha_Move"];

        function init() {
            renderTags();
            if(localStorage.getItem('wya_demo_final')) {
                navTo('screen_radar');
            }
        }

        function navTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen_radar') buildRadar();
        }

        function renderTags() {
            const container = document.getElementById('tagGrid');
            container.innerHTML = '';
            availableTags.forEach(t => {
                const div = document.createElement('div');
                div.className = `tag ${selectedTags.includes(t) ? 'selected' : ''}`;
                div.innerText = t;
                div.onclick = () => {
                    if(selectedTags.includes(t)) selectedTags = selectedTags.filter(i => i !== t);
                    else selectedTags.push(t);
                    renderTags();
                };
                container.appendChild(div);
            });
        }

        function addCustomTag() {
            const input = document.getElementById('customTagInput');
            if(input.value.trim() !== "") {
                availableTags.push(input.value.toUpperCase());
                selectedTags.push(input.value.toUpperCase());
                input.value = "";
                renderTags();
            }
        }

        function validateAndGo() {
            const name = document.getElementById('userName').value;
            if(!name || name.trim() === "") return alert("Display name is required.");
            if(selectedTags.length === 0) return alert("Select at least one interest.");
            
            localStorage.setItem('wya_demo_final', 'true');
            localStorage.setItem('wya_name', name);
            document.getElementById('activeName').innerText = name.toUpperCase();
            navTo('screen_radar');
        }

        function buildRadar() {
            const field = document.getElementById('field');
            const list = document.getElementById('geofenceList');
            field.querySelectorAll('.user-node').forEach(n => n.remove());
            list.innerHTML = '';

            mockUsers.forEach(user => {
                // Add to List
                const li = document.createElement('div');
                li.className = 'user-list-item';
                li.innerHTML = `<span>${user}</span><span style="font-size: 0.6rem; color: var(--pink);">0.${Math.floor(Math.random()*9)}mi</span>`;
                list.appendChild(li);

                // Add to Radar Field
                const node = document.createElement('div');
                node.className = 'user-node';
                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 100;
                node.style.left = (160 + Math.cos(angle) * dist) + 'px';
                node.style.top = (160 + Math.sin(angle) * dist) + 'px';
                field.appendChild(node);
            });

            if(navigator.geolocation) {
                navigator.geolocation.watchPosition(p => {
                    document.getElementById('coordDisplay').innerText = `${p.coords.latitude.toFixed(4)} / ${p.coords.longitude.toFixed(4)}`;
                });
            }
        }

        function toggleDrawer() {
            document.getElementById('userDrawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function hardReset() {
            if(confirm("TERMINATE ARCHITECT SESSION?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
