<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WYA - F.A.I.T.H. Alpha</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --neon-cyan: #00ffff; --neon-pink: #ff00ff; 
            --glass: rgba(0, 0, 0, 0.8); --bg: #000;
        }

        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed; background: var(--bg); 
            font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* Search Bar UI */
        #search-container {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 5000; display: none;
        }
        .search-bar {
            width: 100%; padding: 15px 25px; border-radius: 30px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--neon-cyan); color: #fff;
            box-shadow: 0 0 20px rgba(0,255,255,0.2); font-size: 1rem;
            outline: none; box-sizing: border-box;
        }

        /* UI Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); backdrop-filter: blur(40px);
            z-index: 10000; display: flex; justify-content: center; align-items: center;
        }

        .glass-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; padding: 30px; text-align: center; width: 90%; max-width: 400px;
        }

        .neon-title { font-weight: 900; text-transform: uppercase; letter-spacing: 5px; color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); margin-bottom: 20px; font-size: 1.3rem; }
        
        .primary-btn {
            background: var(--neon-cyan); color: #000; border: none; padding: 18px;
            width: 100%; border-radius: 50px; font-weight: 900; text-transform: uppercase; 
            box-shadow: 0 0 25px var(--neon-cyan); cursor: pointer; margin-top: 15px;
        }

        /* Tag Cloud (Lifestyle Markers) */
        .tag-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .id-tag {
            padding: 10px 18px; border-radius: 25px; background: rgba(255,255,255,0.05);
            font-size: 0.8rem; font-weight: 800; border: 1px solid #333; cursor: pointer; transition: 0.3s;
        }
        .id-tag.active { background: var(--neon-pink); border-color: #fff; box-shadow: 0 0 15px var(--neon-pink); }

        /* Vibe Cards */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 25px; cursor: pointer;
        }
        .card.selected { background: var(--neon-cyan); color: #000; }
        .card span { display: block; font-size: 1.2rem; }

        /* Faith AI Animation */
        .ai-status-text { font-family: monospace; font-size: 0.8rem; color: var(--neon-cyan); margin-top: 20px; }

        /* Profile Card */
        #profile-card {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: var(--glass); backdrop-filter: blur(40px);
            border-top: 2px solid var(--neon-cyan); border-radius: 40px 40px 0 0;
            padding: 40px; z-index: 20000; text-align: center;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #profile-card.active { bottom: 0; }
        .my-tag-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin: 15px 0; }
        .tiny-tag { font-size: 0.6rem; padding: 4px 10px; border-radius: 10px; background: var(--neon-pink); font-weight: 900; }

        /* Radar Nodes */
        .user-dot {
            width: 26px; height: 26px; background: #fff; border: 4px solid var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 25px var(--neon-cyan); position: relative;
        }
        .user-dot::after {
            content: ''; position: absolute; top: -13px; left: -13px; right: -13px; bottom: -13px;
            border: 2px solid var(--neon-cyan); border-radius: 50%;
            animation: radar-pulse 2s infinite; opacity: 0;
        }
        @keyframes radar-pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3.5); opacity: 0; } }

        .business-icon { font-size: 1.5rem; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); cursor: pointer; }
    </style>
</head>
<body>

    <div id="search-container"><input type="text" class="search-bar" placeholder="SEARCH INTENT (e.g. Pizza, Coffee, Tech)"></div>

    <div id="tos-step" class="overlay"><div class="glass-card"><h1 class="neon-title">F.A.I.T.H.</h1><p style="color: #666; font-size: 0.7rem;">ESTABLISHING CONNECTION...</p><button class="primary-btn" style="background: var(--neon-pink);" onclick="nextStep('tos-step', 'tag-step')">CONSENT</button></div></div>

    <div id="tag-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 class="neon-title">IDENTITY</h2>
            <div class="tag-container">
                <div class="id-tag" onclick="toggleTag(this)">GAMING</div>
                <div class="id-tag" onclick="toggleTag(this)">ANIME</div>
                <div class="id-tag" onclick="toggleTag(this)">FITNESS</div>
                <div class="id-tag" onclick="toggleTag(this)">BUSINESS</div>
                <div class="id-tag" onclick="toggleTag(this)">POLITICS</div>
                <div class="id-tag" onclick="toggleTag(this)">CREATIVE</div>
                <div class="id-tag" onclick="toggleTag(this)">TECH</div>
            </div>
            <button class="primary-btn" onclick="nextStep('tag-step', 'vibe-step')">SET IDENTITY</button>
        </div>
    </div>

    <div id="vibe-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 class="neon-title">VIBE</h2>
            <div class="grid">
                <div class="card" onclick="selectVibe(this, 'Business')"><span>💼</span><h3>BUSINESS</h3></div>
                <div class="card" onclick="selectVibe(this, 'Social')"><span>🍹</span><h3>SOCIAL</h3></div>
                <div class="card" onclick="selectVibe(this, 'The Move')"><span>🔥</span><h3>THE MOVE</h3></div>
                <div class="card" onclick="selectVibe(this, 'Romantic')"><span>🌹</span><h3>ROMANCE</h3></div>
            </div>
            <button class="primary-btn" onclick="runFaithAI()">CALIBRATE</button>
        </div>
    </div>

    <div id="faith-ai-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 class="neon-title">FAITH AI</h2>
            <div style="width: 100%; height: 2px; background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan);"></div>
            <p id="ai-status" class="ai-status-text">INITIALIZING RADAR...</p>
        </div>
    </div>

    <div id="bio-step" class="overlay" style="display:none;"><div class="glass-card"><h2 class="neon-title">INTENT</h2><textarea id="bio" placeholder="What's the move?" class="auth-input" style="height:100px;"></textarea><button class="primary-btn" onclick="finalizeProfile()">LAUNCH</button></div></div>

    <div id="profile-card">
        <h2 id="card-name" style="color: var(--neon-cyan); margin:0;">Alpha Node</h2>
        <div id="card-tags" class="my-tag-display"></div>
        <p id="card-bio" style="color: #ccc; margin-bottom: 25px;"></p>
        <button class="primary-btn" style="background:#fff; color:#000;" onclick="document.getElementById('profile-card').classList.remove('active')">CLOSE</button>
    </div>

    <div id="map"></div>

    <script>
        const supabaseUrl = 'https://snecdlasdeolhjefdlum.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZWNkbGFzZGVvbGhqZWZkbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDU4MjQsImV4cCI6MjA5NDAyMTgyNH0.X0wQlmb5vFxXDuW4HHCQMY3tLhRfhjQ7ElifFSxAGEI'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let selectedVibe = '';
        let myTags = [];

        function nextStep(current, next) {
            document.getElementById(current).style.display = 'none';
            document.getElementById(next).style.display = 'flex';
        }

        function toggleTag(el) {
            el.classList.toggle('active');
            const tag = el.innerText;
            if (myTags.includes(tag)) myTags = myTags.filter(t => t !== tag);
            else myTags.push(tag);
        }

        function selectVibe(el, v) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected'); selectedVibe = v;
        }

        function runFaithAI() {
            nextStep('vibe-step', 'faith-ai-step');
            const status = document.getElementById('ai-status');
            const log = ["SCANNING SPATIAL DATA...", "LOCATING GEOFENCES...", "IDENTITY SYNC COMPLETE."];
            let i = 0;
            const interval = setInterval(() => {
                status.innerText = log[i]; i++;
                if (i === log.length) { clearInterval(interval); setTimeout(() => nextStep('faith-ai-step', 'bio-step'), 1000); }
            }, 800);
        }

        async function finalizeProfile() {
            const bioText = document.getElementById('bio').value;
            document.getElementById('bio-step').style.display = 'none';
            document.getElementById('search-container').style.display = 'block';
            initRadar(bioText);
        }

        function initRadar(bio) {
            mapboxgl.accessToken = 'pk.eyJ1Ijoid3lhLWxpdmUiLCJhIjoiY21wMGZ3MGdxMTdoMDRqb3BwbGVscTRmYiJ9.kuZWQ6cwqaoj5Ziw8lm1Kw';
            navigator.geolocation.getCurrentPosition((pos) => {
                const userLoc = [pos.coords.longitude, pos.coords.latitude];
                const map = new mapboxgl.Map({
                    container: 'map', style: 'mapbox://styles/mapbox/dark-v11',
                    center: userLoc, zoom: 16, pitch: 60
                });

                // Visual Geofence Layer
                map.on('load', () => {
                    map.addLayer({
                        'id': 'geofence-zone', 'type': 'circle', 'source': { 'type': 'geojson', 'data': { 'type': 'Point', 'coordinates': userLoc } },
                        'paint': { 'circle-radius': 100, 'circle-color': 'var(--neon-cyan)', 'circle-opacity': 0.1, 'circle-stroke-width': 2, 'circle-stroke-color': 'var(--neon-cyan)' }
                    });
                });

                const el = document.createElement('div'); el.className = 'user-dot';
                el.onclick = () => {
                    document.getElementById('card-bio').innerText = bio;
                    document.getElementById('card-tags').innerHTML = myTags.map(t => `<div class="tiny-tag">${t}</div>`).join('');
                    document.getElementById('profile-card').classList.add('active');
                };
                new mapboxgl.Marker(el).setLngLat(userLoc).addTo(map);

                // Demo Neighbors
                addDemo(map, userLoc[0] + 0.001, userLoc[1] + 0.001, "Coffee Shop", "fas fa-coffee");
                addDemo(map, userLoc[0] - 0.001, userLoc[1] - 0.001, "Fitness Center", "fas fa-dumbbell");

            }, () => { alert("GPS REQ"); }, { enableHighAccuracy: true });
        }

        function addDemo(map, lng, lat, name, icon) {
            const el = document.createElement('div'); el.className = 'business-icon';
            el.innerHTML = `<i class="${icon}"></i>`;
            el.onclick = () => { alert(name + " Geofence Active"); };
            new mapboxgl.Marker(el).setLngLat([lng, lat]).addTo(map);
        }
    </script>
</body>
</html>
