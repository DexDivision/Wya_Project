<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WYA - Boardman Alpha</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    
    <style>
        :root { 
            --neon-cyan: #00ffff; --neon-pink: #ff00ff; 
            --glass: rgba(0, 0, 0, 0.85); --bg: #000;
        }

        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed; background: var(--bg); 
            font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* UI Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); backdrop-filter: blur(30px);
            z-index: 10000; display: flex; justify-content: center; align-items: center;
        }

        .glass-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; padding: 35px; text-align: center; width: 85%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .neon-title { font-weight: 900; text-transform: uppercase; letter-spacing: 5px; color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); margin-bottom: 20px; }
        
        .auth-input {
            width: 100%; padding: 20px; margin-bottom: 15px; border-radius: 20px;
            background: #111; border: 1px solid #333; color: #fff; font-size: 1rem; box-sizing: border-box;
        }

        .primary-btn {
            background: var(--neon-cyan); color: #000; border: none; padding: 22px;
            width: 100%; border-radius: 50px; font-weight: 900; text-transform: uppercase; 
            box-shadow: 0 0 25px var(--neon-cyan); cursor: pointer; transition: 0.2s;
        }
        .primary-btn:active { transform: scale(0.98); opacity: 0.8; }

        /* Vibe Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; border-radius: 30px; text-align: center; transition: 0.3s;
        }
        .card.selected { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }
        .card span { display: block; font-size: 2rem; margin-bottom: 10px; }
        .card h3 { margin: 0; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; }

        /* Profile Card */
        #profile-card {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: var(--glass); backdrop-filter: blur(40px);
            border-top: 2px solid var(--neon-cyan); border-radius: 40px 40px 0 0;
            padding: 40px; z-index: 20000; text-align: center;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #profile-card.active { bottom: 0; }

        /* Nodes */
        .user-dot {
            width: 26px; height: 26px; background: #fff; border: 4px solid var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 25px var(--neon-cyan); position: relative;
        }
        .user-dot::after {
            content: ''; position: absolute; top: -13px; left: -13px; right: -13px; bottom: -13px;
            border: 2px solid var(--neon-cyan); border-radius: 50%;
            animation: radar-pulse 2s infinite; opacity: 0;
        }
        @keyframes radar-pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3.5); opacity: 0; }
        }
        .target-dot { width: 20px; height: 20px; background: var(--neon-pink); border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 20px var(--neon-pink); }
    </style>
</head>
<body>

    <div id="tos-step" class="overlay">
        <div class="glass-card">
            <h1 class="neon-title" style="color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink);">CONSENT</h1>
            <p style="color: #888; margin-bottom: 30px;">WYA uses High-Accuracy GPS to connect you with nearby intent.</p>
            <button class="primary-btn" style="background: var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink);" onclick="nextStep('tos-step', 'auth-step')">I ACCEPT</button>
        </div>
    </div>

    <div id="auth-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 class="neon-title">WYA ACCESS</h2>
            <input type="email" id="email" placeholder="Email" class="auth-input">
            <input type="password" id="password" placeholder="Password" class="auth-input">
            <button class="primary-btn" onclick="handleAuth()">ENTER RADAR</button>
        </div>
    </div>

    <div id="vibe-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 class="neon-title">WHAT'S THE MOVE?</h2>
            <div class="grid">
                <div class="card" id="vibe-business" onclick="selectVibe('Business/Faith')"><span>💼</span><h3>BUSINESS</h3></div>
                <div class="card" id="vibe-move" onclick="selectVibe('The Move')"><span>🔥</span><h3>THE MOVE</h3></div>
                <div class="card" id="vibe-flash" onclick="selectVibe('Flash Burns')"><span>🍕</span><h3>FLASH BURNS</h3></div>
                <div class="card" id="vibe-discovery" onclick="selectVibe('Discovery')"><span>🎲</span><h3>SURPRISE ME</h3></div>
            </div>
            <button class="primary-btn" style="margin-top: 30px;" onclick="nextStep('vibe-step', 'bio-step')">NEXT</button>
        </div>
    </div>

    <div id="bio-step" class="overlay" style="display:none;">
        <div class="glass-card">
            <h2 class="neon-title">YOUR INTENT</h2>
            <textarea id="bio" placeholder="Ex: Looking for B2B partners..." class="auth-input" style="height: 120px;"></textarea>
            <button class="primary-btn" onclick="finalizeProfile()">LAUNCH RADAR</button>
        </div>
    </div>

    <div id="profile-card">
        <div style="color: var(--neon-pink); font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">NODE STATUS</div>
        <h2 id="card-name" class="neon-text">Alpha Founder</h2>
        <p id="card-bio" style="color: #ccc; margin-bottom: 25px;"></p>
        <button class="primary-btn" style="background:#fff; color:#000;" onclick="document.getElementById('profile-card').classList.remove('active')">CLOSE</button>
    </div>

    <div id="map"></div>

    <script>
        const supabaseUrl = 'https://snecdlasdeolhjefdlum.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZWNkbGFzZGVvbGhqZWZkbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDU4MjQsImV4cCI6MjA5NDAyMTgyNH0.X0wQlmb5vFxXDuW4HHCQMY3tLhRfhjQ7ElifFSxAGEI'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let selectedVibe = '';

        function nextStep(current, next) {
            document.getElementById(current).style.display = 'none';
            document.getElementById(next).style.display = 'flex';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await _supabase.auth.signUp({ email, password });
            await _supabase.auth.signInWithPassword({ email, password });
            nextStep('auth-step', 'vibe-step');
        }

        function selectVibe(vibe) {
            selectedVibe = vibe;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            const idMap = {'Business/Faith':'vibe-business', 'The Move':'vibe-move', 'Flash Burns':'vibe-flash', 'Discovery':'vibe-discovery'};
            document.getElementById(idMap[vibe]).classList.add('selected');
        }

        async function finalizeProfile() {
            const bioText = document.getElementById('bio').value;
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) { await _supabase.from('profiles').upsert({ id: user.id, email: user.email, current_vibe: selectedVibe, bio: bioText }); }
            document.getElementById('bio-step').style.display = 'none';
            initRadar(bioText);
        }

        function initRadar(bio) {
            mapboxgl.accessToken = 'pk.eyJ1Ijoid3lhLWxpdmUiLCJhIjoiY21wMGZ3MGdxMTdoMDRqb3BwbGVscTRmYiJ9.kuZWQ6cwqaoj5Ziw8lm1Kw';
            navigator.geolocation.getCurrentPosition((pos) => {
                const userLoc = [pos.coords.longitude, pos.coords.latitude];
                const map = new mapboxgl.Map({
                    container: 'map', style: 'mapbox://styles/mapbox/dark-v11',
                    center: userLoc, zoom: 17, pitch: 60
                });

                // User Marker
                const el = document.createElement('div'); el.className = 'user-dot';
                el.onclick = () => {
                    document.getElementById('card-name').innerText = "Founder (Alpha)";
                    document.getElementById('card-bio').innerText = bio;
                    document.getElementById('profile-card').classList.add('active');
                };
                new mapboxgl.Marker(el).setLngLat(userLoc).addTo(map);

                // Geofence Demo Check (If near Magic Tree coordinates)
                const venueLoc = [userLoc[0] + 0.0005, userLoc[1] + 0.0005]; // Simulated Geofence
                addVenue(map, venueLoc, "Venue Partner", "Check-in here for exclusive business rewards.");

            }, () => { alert("GPS Access Required!"); }, { enableHighAccuracy: true });
        }

        function addVenue(map, loc, name, bio) {
            const el = document.createElement('div'); el.className = 'target-dot';
            el.onclick = () => {
                document.getElementById('card-name').innerText = name;
                document.getElementById('card-bio').innerText = bio;
                document.getElementById('profile-card').classList.add('active');
            };
            new mapboxgl.Marker(el).setLngLat(loc).addTo(map);
        }
    </script>
</body>
</html>
